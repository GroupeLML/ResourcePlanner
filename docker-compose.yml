name: resourceplanner

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ${RESOURCEPLANNER_BACKEND_IMAGE:-resourceplanner-backend}:${RESOURCEPLANNER_IMAGE_TAG:-local}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      RESOURCEPLANNER_DATABASE_URL: "${RESOURCEPLANNER_DATABASE_URL:-sqlite+pysqlite:////data/resourceplanner.db}"
    volumes:
      - resourceplanner-data:/data
    restart: "no"

  import-projects:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.importer
    image: ${RESOURCEPLANNER_IMPORTER_IMAGE:-resourceplanner-importer}:${RESOURCEPLANNER_IMAGE_TAG:-local}
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      RESOURCEPLANNER_DATABASE_URL: "${RESOURCEPLANNER_DATABASE_URL:-sqlite+pysqlite:////data/resourceplanner.db}"
    volumes:
      - resourceplanner-data:/data
      - "${RESOURCEPLANNER_IMPORTS_PATH:-./imports}:/imports:ro"
    restart: "no"

  import-tasks:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.importer
    image: ${RESOURCEPLANNER_IMPORTER_IMAGE:-resourceplanner-importer}:${RESOURCEPLANNER_IMAGE_TAG:-local}
    entrypoint: ["python", "tools/import_erp_tasks.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      RESOURCEPLANNER_DATABASE_URL: "${RESOURCEPLANNER_DATABASE_URL:-sqlite+pysqlite:////data/resourceplanner.db}"
    volumes:
      - resourceplanner-data:/data
      - "${RESOURCEPLANNER_IMPORTS_PATH:-./imports}:/imports:ro"
    restart: "no"

  seed-dev:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ${RESOURCEPLANNER_BACKEND_IMAGE:-resourceplanner-backend}:${RESOURCEPLANNER_IMAGE_TAG:-local}
    command: ["python", "tools/seed_demo_data.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      RESOURCEPLANNER_DATABASE_URL: "${RESOURCEPLANNER_DATABASE_URL:-sqlite+pysqlite:////data/resourceplanner.db}"
    volumes:
      - resourceplanner-data:/data
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ${RESOURCEPLANNER_BACKEND_IMAGE:-resourceplanner-backend}:${RESOURCEPLANNER_IMAGE_TAG:-local}
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      RESOURCEPLANNER_DATABASE_URL: "${RESOURCEPLANNER_DATABASE_URL:-sqlite+pysqlite:////data/resourceplanner.db}"
      RESOURCEPLANNER_HOST: "0.0.0.0"
      RESOURCEPLANNER_PORT: "8000"
      RESOURCEPLANNER_LOG_LEVEL: "${RESOURCEPLANNER_LOG_LEVEL:-info}"
      RESOURCEPLANNER_AUTH_MODE: "${RESOURCEPLANNER_AUTH_MODE:-local}"
      RESOURCEPLANNER_ALLOW_LOCAL_AUTH_NETWORK: "${RESOURCEPLANNER_ALLOW_LOCAL_AUTH_NETWORK:-true}"
      RESOURCEPLANNER_DEV_USER_SWITCHER: "${RESOURCEPLANNER_DEV_USER_SWITCHER:-false}"
      RESOURCEPLANNER_LOCAL_AUTH_NAME: "${RESOURCEPLANNER_LOCAL_AUTH_NAME:-Administrateur local}"
      RESOURCEPLANNER_LOCAL_AUTH_ROLES: "${RESOURCEPLANNER_LOCAL_AUTH_ROLES:-ADMIN}"
      RESOURCEPLANNER_OIDC_DISCOVERY_URL: "${RESOURCEPLANNER_OIDC_DISCOVERY_URL:-}"
      RESOURCEPLANNER_OIDC_CLIENT_ID: "${RESOURCEPLANNER_OIDC_CLIENT_ID:-}"
      RESOURCEPLANNER_OIDC_CLIENT_SECRET: "${RESOURCEPLANNER_OIDC_CLIENT_SECRET:-}"
      RESOURCEPLANNER_OIDC_REDIRECT_URI: "${RESOURCEPLANNER_OIDC_REDIRECT_URI:-}"
      RESOURCEPLANNER_OIDC_SCOPES: "${RESOURCEPLANNER_OIDC_SCOPES:-openid profile email}"
      RESOURCEPLANNER_OIDC_COOKIE_NAME: "${RESOURCEPLANNER_OIDC_COOKIE_NAME:-resourceplanner_session}"
      RESOURCEPLANNER_OIDC_SESSION_HOURS: "${RESOURCEPLANNER_OIDC_SESSION_HOURS:-8}"
      RESOURCEPLANNER_OIDC_SECURE_COOKIE: "${RESOURCEPLANNER_OIDC_SECURE_COOKIE:-true}"
      RESOURCEPLANNER_OIDC_AUTO_PROVISION: "${RESOURCEPLANNER_OIDC_AUTO_PROVISION:-false}"
      RESOURCEPLANNER_API_DOCS_ENABLED: "${RESOURCEPLANNER_API_DOCS_ENABLED:-true}"
      RESOURCEPLANNER_ACUMATICA_BASE_URL: "${RESOURCEPLANNER_ACUMATICA_BASE_URL:-}"
      RESOURCEPLANNER_ACUMATICA_USERNAME: "${RESOURCEPLANNER_ACUMATICA_USERNAME:-}"
      RESOURCEPLANNER_ACUMATICA_PASSWORD: "${RESOURCEPLANNER_ACUMATICA_PASSWORD:-}"
      RESOURCEPLANNER_ACUMATICA_PAGE_SIZE: "${RESOURCEPLANNER_ACUMATICA_PAGE_SIZE:-100}"
      RESOURCEPLANNER_ACUMATICA_TIMEOUT_SECONDS: "${RESOURCEPLANNER_ACUMATICA_TIMEOUT_SECONDS:-30}"
      RESOURCEPLANNER_CONFIG_ENCRYPTION_KEY: "${RESOURCEPLANNER_CONFIG_ENCRYPTION_KEY:-}"
    volumes:
      - resourceplanner-data:/data
      - resourceplanner-logs:/home/resourceplanner/.resourceplanner/logs
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ${RESOURCEPLANNER_FRONTEND_IMAGE:-resourceplanner-frontend}:${RESOURCEPLANNER_IMAGE_TAG:-local}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      RESOURCEPLANNER_FRAME_ANCESTORS: "${RESOURCEPLANNER_FRAME_ANCESTORS:-'self'}"
    ports:
      - "127.0.0.1:${RESOURCEPLANNER_HTTP_PORT:-8080}:8080"
    restart: unless-stopped

  dev-cockpit:
    profiles: ["dev-tools"]
    build:
      context: ./dev-cockpit
      dockerfile: Dockerfile
    image: ${DEV_COCKPIT_IMAGE:-resourceplanner-dev-cockpit}:${RESOURCEPLANNER_IMAGE_TAG:-local}
    environment:
      DEV_COCKPIT_GITHUB_TOKEN: "${DEV_COCKPIT_GITHUB_TOKEN:-}"
      DEV_COCKPIT_REPOSITORY: "${DEV_COCKPIT_REPOSITORY:-tchi99/RessourcePlanner}"
      DEV_COCKPIT_ROADMAP_ISSUE: "${DEV_COCKPIT_ROADMAP_ISSUE:-55}"
      DEV_COCKPIT_STALLED_AFTER_MINUTES: "${DEV_COCKPIT_STALLED_AFTER_MINUTES:-30}"
      DEV_COCKPIT_DATA_DIR: "/data"
    volumes:
      - dev-cockpit-data:/data
    ports:
      - "127.0.0.1:${DEV_COCKPIT_HTTP_PORT:-8081}:8000"
    # Outil local/dev explicite : ne pas le redémarrer automatiquement avec le runtime hôte.
    restart: "no"

volumes:
  resourceplanner-data:
  resourceplanner-logs:
  dev-cockpit-data:
