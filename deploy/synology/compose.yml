name: resourceplanner

services:
  backend:
    build:
      context: ../..
      dockerfile: Dockerfile.backend
    image: ${RESOURCEPLANNER_BACKEND_IMAGE:-resourceplanner-backend}:${RESOURCEPLANNER_IMAGE_TAG:?Définir RESOURCEPLANNER_IMAGE_TAG}
    environment:
      RESOURCEPLANNER_DATABASE_URL: "${RESOURCEPLANNER_DATABASE_URL:?Définir RESOURCEPLANNER_DATABASE_URL}"
      RESOURCEPLANNER_HOST: "0.0.0.0"
      RESOURCEPLANNER_PORT: "8000"
      RESOURCEPLANNER_LOG_LEVEL: "${RESOURCEPLANNER_LOG_LEVEL:-info}"
      RESOURCEPLANNER_AUTH_MODE: "${RESOURCEPLANNER_AUTH_MODE:-oidc}"
      RESOURCEPLANNER_ALLOW_LOCAL_AUTH_NETWORK: "${RESOURCEPLANNER_ALLOW_LOCAL_AUTH_NETWORK:-false}"
      RESOURCEPLANNER_DEV_USER_SWITCHER: "false"
      RESOURCEPLANNER_LOCAL_AUTH_NAME: "${RESOURCEPLANNER_LOCAL_AUTH_NAME:-}"
      RESOURCEPLANNER_LOCAL_AUTH_EMAIL: "${RESOURCEPLANNER_LOCAL_AUTH_EMAIL:-}"
      RESOURCEPLANNER_LOCAL_AUTH_ROLES: "${RESOURCEPLANNER_LOCAL_AUTH_ROLES:-ADMIN}"
      RESOURCEPLANNER_OIDC_DISCOVERY_URL: "${RESOURCEPLANNER_OIDC_DISCOVERY_URL:-}"
      RESOURCEPLANNER_OIDC_CLIENT_ID: "${RESOURCEPLANNER_OIDC_CLIENT_ID:-}"
      RESOURCEPLANNER_OIDC_CLIENT_SECRET: "${RESOURCEPLANNER_OIDC_CLIENT_SECRET:-}"
      RESOURCEPLANNER_OIDC_REDIRECT_URI: "${RESOURCEPLANNER_OIDC_REDIRECT_URI:-}"
      RESOURCEPLANNER_OIDC_SCOPES: "${RESOURCEPLANNER_OIDC_SCOPES:-openid profile email}"
      RESOURCEPLANNER_OIDC_COOKIE_NAME: "${RESOURCEPLANNER_OIDC_COOKIE_NAME:-resourceplanner_session}"
      RESOURCEPLANNER_OIDC_SESSION_HOURS: "${RESOURCEPLANNER_OIDC_SESSION_HOURS:-8}"
      RESOURCEPLANNER_OIDC_SECURE_COOKIE: "${RESOURCEPLANNER_OIDC_SECURE_COOKIE:-true}"
      RESOURCEPLANNER_OIDC_AUTO_PROVISION: "${RESOURCEPLANNER_OIDC_AUTO_PROVISION:-false}"
      RESOURCEPLANNER_API_DOCS_ENABLED: "${RESOURCEPLANNER_API_DOCS_ENABLED:-false}"
      RESOURCEPLANNER_ACUMATICA_BASE_URL: "${RESOURCEPLANNER_ACUMATICA_BASE_URL:-}"
      RESOURCEPLANNER_ACUMATICA_ACCESS_TOKEN: "${RESOURCEPLANNER_ACUMATICA_ACCESS_TOKEN:-}"
      RESOURCEPLANNER_ACUMATICA_ENDPOINT: "${RESOURCEPLANNER_ACUMATICA_ENDPOINT:-Default}"
      RESOURCEPLANNER_ACUMATICA_VERSION: "${RESOURCEPLANNER_ACUMATICA_VERSION:-}"
      RESOURCEPLANNER_M365_TENANT_ID: "${RESOURCEPLANNER_M365_TENANT_ID:-}"
      RESOURCEPLANNER_M365_CLIENT_ID: "${RESOURCEPLANNER_M365_CLIENT_ID:-}"
      RESOURCEPLANNER_M365_CLIENT_SECRET: "${RESOURCEPLANNER_M365_CLIENT_SECRET:-}"
      RESOURCEPLANNER_M365_MAILBOX: "${RESOURCEPLANNER_M365_MAILBOX:-}"
      RESOURCEPLANNER_CONFIG_ENCRYPTION_KEY: "${RESOURCEPLANNER_CONFIG_ENCRYPTION_KEY:-}"
    volumes:
      - resourceplanner-data:/data
      - resourceplanner-logs:/home/resourceplanner/.resourceplanner/logs
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    image: ${RESOURCEPLANNER_FRONTEND_IMAGE:-resourceplanner-frontend}:${RESOURCEPLANNER_IMAGE_TAG:?Définir RESOURCEPLANNER_IMAGE_TAG}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      RESOURCEPLANNER_FRAME_ANCESTORS: "${RESOURCEPLANNER_FRAME_ANCESTORS:-'self'}"
    ports:
      - "${RESOURCEPLANNER_BIND_ADDRESS:-0.0.0.0}:${RESOURCEPLANNER_HTTP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  resourceplanner-data:
  resourceplanner-logs:
