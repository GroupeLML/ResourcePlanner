name: Generate 457C Alembic baseline

on:
  push:
    branches:
      - feat/457c-alembic-baseline-v2
    paths:
      - .github/workflows/457c-baseline-generator.yml

permissions:
  contents: write

jobs:
  generate-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout 457C branch
        uses: actions/checkout@v4
        with:
          ref: feat/457c-alembic-baseline-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-server.txt

      - name: Install canonical server dependencies
        run: python -m pip install -r requirements-server.txt

      - name: Replace pre-production history with generated static baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -f migrations/versions/*.py
          rm -f /tmp/resourceplanner-baseline-autogen.db /tmp/resourceplanner-baseline-verify.db

          export RESOURCEPLANNER_DATABASE_URL=sqlite+pysqlite:////tmp/resourceplanner-baseline-autogen.db
          python -m alembic revision \
            --autogenerate \
            --rev-id 0001_v2_production_baseline \
            -m "V2 production baseline"

          generated="$(find migrations/versions -maxdepth 1 -type f -name '0001_v2_production_baseline_*.py' -print -quit)"
          test -n "$generated"
          mv "$generated" migrations/versions/0001_v2_production_baseline.py
          sed -i 's/[[:space:]]\\+$//' migrations/versions/0001_v2_production_baseline.py
          test "$(find migrations/versions -maxdepth 1 -type f -name '*.py' | wc -l)" -eq 1

      - name: Validate fresh SQLite and offline SQL Server
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app tests tools migrations main.py
          rm -f /tmp/resourceplanner-baseline-verify.db
          RESOURCEPLANNER_DATABASE_URL=sqlite+pysqlite:////tmp/resourceplanner-baseline-verify.db \
            python -m alembic upgrade head
          RESOURCEPLANNER_DATABASE_URL=sqlite+pysqlite:////tmp/resourceplanner-baseline-verify.db \
            python -m alembic current
          python tools/check_sqlserver_readiness.py

      - name: Commit generated baseline
        shell: bash
        run: |
          set -euo pipefail
          git add migrations/versions
          git diff --cached --check
          test -n "$(git status --porcelain migrations/versions)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(457C): replace pre-production migrations with V2 baseline"
          git push origin HEAD:feat/457c-alembic-baseline-v2
