name: CI

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "Installer_Web.bat"
      - "Lancer_Serveur.bat"
      - "Lancer_Web.bat"
      - "Verifier_Web.bat"
      - "Charger_Donnees_Demo.bat"
      - "Dockerfile.backend"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".env.example"
      - "deploy/**"
      - "app/**"
      - "tests/**"
      - "tools/**"
      - "migrations/**"
      - "frontend/**"
      - "dev-cockpit/**"
      - "docs/**"
      - "alembic.ini"
      - "requirements*.txt"
      - "constraints*.txt"
      - ".github/workflows/**"

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    outputs:
      documentation_only: ${{ steps.classify.outputs.documentation_only }}
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      runtime: ${{ steps.classify.outputs.runtime }}
      conservative: ${{ steps.classify.outputs.conservative }}
      issue_894_inventory_only: ${{ steps.phase.outputs.issue_894_inventory_only }}
      issue_894_perf_preflight_only: ${{ steps.phase.outputs.issue_894_perf_preflight_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          git diff --name-only --no-renames "$base_sha" "$head_sha" > /tmp/changed-files.txt
          cat /tmp/changed-files.txt
          python tools/ci_change_classifier.py < /tmp/changed-files.txt | tee -a "$GITHUB_OUTPUT"
      - name: Detect bounded #894 diagnostic phase
        id: phase
        shell: bash
        run: |
          set -euo pipefail
          head_sha="${{ github.event.pull_request.head.sha }}"
          message="$(git log -1 --format=%B "$head_sha")"
          if printf '%s\n' "$message" | grep -Fxq 'RP894_ENVIRONMENT_INVENTORY_ONLY'; then
            printf 'issue_894_inventory_only=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'issue_894_inventory_only=false\n' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$message" | grep -Fxq 'RP894_PERF_PREFLIGHT_ONLY'; then
            printf 'issue_894_perf_preflight_only=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'issue_894_perf_preflight_only=false\n' >> "$GITHUB_OUTPUT"
          fi

  server-isolation:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.runtime == 'true' || needs.changes.outputs.conservative == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-server.txt
      - name: Install Web/SQL server dependencies only
        run: python -m pip install -r requirements-server.txt
      - name: Compile canonical Web/SQL sources
        run: >-
          python -m compileall -q
          app/application
          app/domain
          app/infrastructure/sql
          app/infrastructure/acumatica
          app/infrastructure/m365
          app/server
          migrations
          tools/check_server_dependency_isolation.py
          tools/check_server_runtime.py
          tools/check_erp_activation_readiness.py
          tools/check_sqlserver_readiness.py
          tools/smoke_sqlserver_readonly.py
          tools/smoke_sqlserver_transaction.py
          tools/check_web_runtime.py
          tools/check_installed_web.py
          tools/smoke_running_web.py
          tools/issue_894_phase4_server.py
          tools/issue_894_phase4_load.py
          tools/issue_894_phase4_stats.py
          tools/issue_894_phase4_performance_report.py
          tools/issue_894_connection_trace.py
          tools/issue_894_connection_trial.py
          tools/cutover_inventory.py
      - name: Guard Web/SQL boundaries from V1 imports
        run: python tools/cutover_inventory.py --check-boundaries
      - name: Smoke server without NiceGUI or Excel dependencies
        run: python tools/check_server_dependency_isolation.py
      - name: Validate SQLite migrations and offline SQL Server readiness
        run: python tools/check_sqlserver_readiness.py

  python-tests:
    needs: changes
    name: Python verification (shard ${{ matrix.shard_index }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # #370: 3-shard pilot not retained; measured gain was unstable and costlier.
        # Keep both matrix checks present even for documentation-only PRs because
        # branch protection requires the concrete shard 0/shard 1 check names.
        shard_index: [0, 1]
    env:
      RUN_PYTHON_VERIFICATION: ${{ needs.changes.result != 'success' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.runtime == 'true' || needs.changes.outputs.conservative == 'true' }}
    steps:
      - name: Documentation-only no-op
        if: env.RUN_PYTHON_VERIFICATION != 'true'
        run: echo "Python verification skipped for documentation-only changes."
      - name: Checkout
        if: env.RUN_PYTHON_VERIFICATION == 'true'
        uses: actions/checkout@v4
      - name: Set up Python
        if: env.RUN_PYTHON_VERIFICATION == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-server.txt
      - name: Install validated dependencies
        if: env.RUN_PYTHON_VERIFICATION == 'true'
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        if: env.RUN_PYTHON_VERIFICATION == 'true'
        run: python -m compileall -q app tests tools migrations
      - name: Run verification suite shard
        if: env.RUN_PYTHON_VERIFICATION == 'true'
        run: >-
          python tools/run_test_shard.py
          --shard-index "${{ matrix.shard_index }}"
          --shard-count 2
          --top-slowest 25
      - name: Enforce V2 SQLite performance budgets
        if: env.RUN_PYTHON_VERIFICATION == 'true' && matrix.shard_index == 0
        run: >-
          python tools/benchmark_v2_api.py
          --iterations 3
          --ci
          --output /tmp/v2-performance-baseline.json
      - name: Scan current repository tree for common PII and secrets
        if: env.RUN_PYTHON_VERIFICATION == 'true' && matrix.shard_index == 1
        run: python tools/privacy_scan.py

  frontend-validation:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.runtime == 'true' || needs.changes.outputs.conservative == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-server.txt
      - name: Install Web/SQL dependencies for browser fixture
        run: python -m pip install -r requirements-server.txt
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache npm download store
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package.json') }}
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Build React V2 frontend
        working-directory: frontend
        run: npm run build
      - name: Run React V2 browser acceptance
        working-directory: frontend
        run: npm run test:e2e
      - name: Smoke complete FastAPI + React runtime
        run: python tools/check_web_runtime.py

  docker-smoke:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.runtime == 'true' || needs.changes.outputs.conservative == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESOURCEPLANNER_IMAGE_TAG: ci
      RESOURCEPLANNER_HTTP_PORT: "18080"
      RESOURCEPLANNER_GIT_REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: |
          docker compose config >/tmp/resourceplanner-compose.yml
          docker compose --profile demo config >/tmp/resourceplanner-compose-demo.yml
          RESOURCEPLANNER_IMAGE_TAG=ci \
          RESOURCEPLANNER_DATABASE_URL=sqlite+pysqlite:////data/resourceplanner.db \
          RESOURCEPLANNER_AUTH_MODE=local \
          RESOURCEPLANNER_ALLOW_LOCAL_AUTH_NETWORK=true \
          docker compose -f deploy/synology/compose.yml config >/tmp/resourceplanner-synology-compose.yml
      - name: Build and start Docker runtime
        run: docker compose up -d --build
      - name: Validate frontend image revision metadata
        run: |
          frontend_image="$(docker compose images -q frontend)"
          test -n "$frontend_image"
          image_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$frontend_image")"
          test "$image_revision" = "$RESOURCEPLANNER_GIT_REVISION"
          docker run --rm --entrypoint cat "$frontend_image" /usr/share/nginx/html/build-meta.js \
            | grep -F "$RESOURCEPLANNER_GIT_REVISION"
      - name: Validate backend/frontend OCI source revision pair
        run: |
          backend_image="$(docker compose images -q backend)"
          migrate_image="$(docker compose images -q migrate)"
          frontend_image="$(docker compose images -q frontend)"
          test -n "$backend_image"
          test -n "$migrate_image"
          test -n "$frontend_image"
          test "$migrate_image" = "$backend_image"
          backend_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$backend_image")"
          frontend_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$frontend_image")"
          test "$backend_revision" = "$RESOURCEPLANNER_GIT_REVISION"
          test "$frontend_revision" = "$RESOURCEPLANNER_GIT_REVISION"
          test "$backend_revision" = "$frontend_revision"
      - name: Validate packaged SQL Server driver
        run: |
          docker compose exec -T backend python - <<'PY'
          import pyodbc

          assert pyodbc.version == "5.3.0", pyodbc.version
          drivers = pyodbc.drivers()
          assert "ODBC Driver 18 for SQL Server" in drivers, drivers
          print("pyodbc:", pyodbc.version)
          print("ODBC drivers:", drivers)
          PY
      - name: Validate packaged Toronto IANA timezone data
        run: |
          docker compose exec -T backend python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo

          zone = ZoneInfo("America/Toronto")
          assert datetime(2026, 1, 15, 0, 0, tzinfo=zone).utcoffset() is not None
          print("timezone:", zone.key)
          PY
      - name: Validate packaged ERP activation readiness entrypoint
        run: docker compose exec -T backend python tools/check_erp_activation_readiness.py --help >/dev/null
      - name: Validate Compose ERP safety defaults inside backend
        run: |
          docker compose exec -T backend python - <<'PY'
          from app.server.runtime import ServerSettings

          settings = ServerSettings.from_environment()
          assert settings.erp_sync.enabled is False
          assert settings.erp_sync.timezone_name == "America/Toronto"
          assert settings.erp_sync.catchup_hours == 4
          assert settings.erp_sync.freshness_sla_hours == 30
          assert settings.erp_sync_evidence.min_source_ratio == 0.50
          assert settings.erp_sync_evidence.min_projects == 1
          assert settings.erp_sync_evidence.min_task_rows == 1
          assert settings.erp_sync_evidence.max_evidence_mib == 256
          assert settings.erp_sync_evidence.evidence_budget_mib == 2048
          assert settings.erp_sync_evidence.failure_retention_days == 14
          assert settings.erp_sync_evidence.history_days == 90
          print("ERP Compose defaults parsed; automatic sync remains disabled.")
          PY
      - name: Assert opt-in services stay out of normal startup
        run: |
          ! docker compose ps --all --services | grep -qx 'dev-cockpit'
          ! docker compose ps --all --services | grep -qx 'seed-dev'
      - name: Smoke clean bootstrap, local admin and empty business data
        run: |
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/ready | grep -q '"status":"ready"'; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"
          curl -fsSI http://127.0.0.1:18080/build-meta.js \
            | tr -d '\r' \
            | grep -Fqi 'Cache-Control: no-store, no-cache, must-revalidate'
          curl -fsS http://127.0.0.1:18080/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:18080/ | grep -qi '<html'
          curl -fsS 'http://127.0.0.1:18080/api/v1/auth/me' >/tmp/auth.json
          curl -fsS 'http://127.0.0.1:18080/api/v1/admin/users' >/tmp/users.json
          curl -fsS 'http://127.0.0.1:18080/api/v1/projects?active_only=true' >/tmp/projects.json
          curl -fsS 'http://127.0.0.1:18080/api/v1/task-catalog?active_only=true' >/tmp/tasks.json
          curl -fsS 'http://127.0.0.1:18080/api/v1/work-packages?active_only=true' >/tmp/work-packages.json
          curl -fsS 'http://127.0.0.1:18080/api/v1/demands' >/tmp/demands.json
          curl -fsS 'http://127.0.0.1:18080/api/v1/resources?active_only=true' >/tmp/resources.json
          python - <<'PY'
          import json

          def load(path):
              with open(path, encoding="utf-8") as handle:
                  return json.load(handle)

          auth = load("/tmp/auth.json")
          assert auth["auth_mode"] == "local", auth
          assert auth["local_user_id"] is not None, auth
          assert "ADMIN" in auth["roles"], auth

          users = load("/tmp/users.json")
          assert len(users) == 1, users
          bootstrap = users[0]
          assert bootstrap["user_id"] == auth["local_user_id"], (bootstrap, auth)
          assert bootstrap["issuer"] == auth["issuer"] == "urn:resourceplanner:local", (bootstrap, auth)
          assert bootstrap["subject"] == auth["subject"] == "local-user", (bootstrap, auth)
          assert bootstrap["active"] is True, bootstrap
          assert "ADMIN" in bootstrap["roles"], bootstrap

          for path in (
              "/tmp/projects.json",
              "/tmp/tasks.json",
              "/tmp/work-packages.json",
              "/tmp/demands.json",
              "/tmp/resources.json",
          ):
              assert load(path) == [], (path, load(path))
          PY
      - name: Verify durable ERP occurrence survives backend restart without duplication
        run: |
          occurrence_before="$(docker compose exec -T backend python - <<'PY'
          import os
          from dataclasses import replace
          from app.application.erp_sync_scheduler import (
              UnavailableErpSyncAutomaticSafetyCapability,
          )
          from app.infrastructure.sql import create_session_factory, create_sql_engine
          from app.infrastructure.sql.erp_sync_control_repository import SqlErpSyncControlRepository
          from app.server.runtime import ServerSettings

          engine = create_sql_engine(os.environ["RESOURCEPLANNER_DATABASE_URL"])
          repository = SqlErpSyncControlRepository(create_session_factory(engine))
          repository.ensure_control_row()
          runtime_settings = ServerSettings.from_environment().erp_sync
          decision_settings = replace(runtime_settings, enabled=True)
          assert decision_settings.config_fingerprint == runtime_settings.config_fingerprint
          occurrence = repository.record_daily_decision(
              decision_settings,
              UnavailableErpSyncAutomaticSafetyCapability(),
          )
          assert occurrence is not None
          print(f"{occurrence.id}|{occurrence.occurrence_key}")
          engine.dispose()
          PY
          )"
          occurrence_id="$(printf '%s' "$occurrence_before" | cut -d'|' -f1)"
          occurrence_key="$(printf '%s' "$occurrence_before" | cut -d'|' -f2-)"

          docker compose restart backend >/dev/null

          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/ready | grep -q '"status":"ready"'; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"

          docker compose exec -T \
            -e EXPECTED_OCCURRENCE_ID="$occurrence_id" \
            -e EXPECTED_OCCURRENCE_KEY="$occurrence_key" \
            backend python - <<'PY'
          import os
          from sqlalchemy import select
          from app.infrastructure.sql import (
              ErpSyncOccurrence,
              create_session_factory,
              create_sql_engine,
          )

          engine = create_sql_engine(os.environ["RESOURCEPLANNER_DATABASE_URL"])
          factory = create_session_factory(engine)
          with factory() as session:
              rows = tuple(
                  session.scalars(
                      select(ErpSyncOccurrence).where(
                          ErpSyncOccurrence.occurrence_key
                          == os.environ["EXPECTED_OCCURRENCE_KEY"]
                      )
                  )
              )
              assert len(rows) == 1, rows
              assert rows[0].id == os.environ["EXPECTED_OCCURRENCE_ID"], rows[0].id
          engine.dispose()
          PY
      - name: Show Docker diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=300
      - name: Stop Docker runtime
        if: always()
        run: docker compose down -v --remove-orphans

  sqlserver-live-573e:
    name: SQL Server live 363F / 573E / 594D
    needs: changes
    if: ${{ startsWith(github.event.pull_request.title, '363F') || startsWith(github.event.pull_request.title, '573E') || startsWith(github.event.pull_request.title, '594D') || startsWith(github.event.pull_request.title, '655C') || startsWith(github.event.pull_request.title, '#778') || startsWith(github.event.pull_request.title, '#777') || startsWith(github.event.pull_request.title, '#793') || startsWith(github.event.pull_request.title, '#781') || startsWith(github.event.pull_request.title, '#742') || startsWith(github.event.pull_request.title, '#830') || startsWith(github.event.pull_request.title, '#855') || startsWith(github.event.pull_request.title, '#877') || startsWith(github.event.pull_request.title, '#880') || startsWith(github.event.pull_request.title, '#894') || startsWith(github.event.pull_request.title, '643A') || startsWith(github.event.pull_request.title, '643B') || startsWith(github.event.pull_request.title, '643C') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build backend image with ODBC Driver 18
        run: docker build -f Dockerfile.backend -t resourceplanner-573e-live .
      - name: Validate migration, read-only diagnostic and multi-session CAS on SQL Server
        shell: bash
        run: |
          set -euo pipefail
          network="rp-573e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          server="rp-sqlserver-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ephemeral_value="RpA1_$(openssl rand -hex 16)"
          database="ResourcePlanner573E"
          sql_env_file="$(mktemp)"
          printf 'MSSQL_SA_%s=%s\n' 'PASSWORD' "$ephemeral_value" > "$sql_env_file"

          cleanup() {
            docker rm -f "$server" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
            rm -f "$sql_env_file"
          }
          trap cleanup EXIT

          docker network create "$network" >/dev/null
          docker run -d \
            --name "$server" \
            --network "$network" \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            --env-file "$sql_env_file" \
            mcr.microsoft.com/mssql/server:2022-latest >/dev/null

          ready=0
          for attempt in $(seq 1 60); do
            if docker run --rm \
              --network "$network" \
              -e SQL_SERVER="$server" \
              -e SQL_VALUE="$ephemeral_value" \
              resourceplanner-573e-live \
              python -c 'import os, pyodbc; k="P"+"WD"; c=pyodbc.connect("DRIVER={ODBC Driver 18 for SQL Server};SERVER="+os.environ["SQL_SERVER"]+",1433;UID=sa;"+k+"="+os.environ["SQL_VALUE"]+";Encrypt=yes;TrustServerCertificate=yes", timeout=3); c.close()' \
              >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"

          docker run --rm -i \
            --network "$network" \
            -e SQL_SERVER="$server" \
            -e SQL_VALUE="$ephemeral_value" \
            -e SQL_DATABASE="$database" \
            resourceplanner-573e-live \
            python - <<'PY'
          import os
          import pyodbc

          connection = pyodbc.connect(
              "DRIVER={ODBC Driver 18 for SQL Server};"
              f"SERVER={os.environ['SQL_SERVER']},1433;"
              "UID=sa;"
              f"{'P' + 'WD'}={os.environ['SQL_VALUE']};"
              "Encrypt=yes;TrustServerCertificate=yes",
              autocommit=True,
          )
          try:
              cursor = connection.cursor()
              cursor.execute(
                  f"IF DB_ID('{os.environ['SQL_DATABASE']}') IS NULL "
                  f"CREATE DATABASE [{os.environ['SQL_DATABASE']}]"
              )
          finally:
              connection.close()
          PY

          database_url="mssql+pyodbc://sa:${ephemeral_value}@${server}:1433/${database}?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"

          docker run --rm \
            --network "$network" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /workspace \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e RESOURCEPLANNER_DATABASE_URL="$database_url" \
            -e RESOURCEPLANNER_SQLSERVER_TEST_URL="$database_url" \
            resourceplanner-573e-live \
            sh -lc '
              python -m alembic upgrade head &&
              python -m unittest -v \
                tests.test_project_co_managers_sqlserver_concurrency \
                tests.test_project_manager_legacy_diagnostic \
                tests.test_operational_responsibility_sqlserver_concurrency \
                tests.test_planning_window_override_sqlserver_concurrency \
                tests.test_request_work_queue_sqlserver_concurrency \
                tests.test_resource_residence_city_sqlserver_migration \
                tests.test_erp_sync_sqlserver_concurrency \
                tests.test_issue_777_sqlserver_concurrency \
                tests.test_issue_793_sqlserver_precision \
                tests.test_issue_830_sqlserver_migration \
                tests.test_issue_855_sqlserver_migration \
                tests.test_issue_877_sqlserver \
                tests.test_issue_880_sqlserver_migration \
                tests.test_emergency_broadcast_sqlserver_concurrency \
                tests.test_same_resource_periods \
                tests.test_verification_execution_sqlserver_concurrency &&
              python tools/diagnose_project_manager_legacy_links.py --json
            '



  issue-894-environment-inventory:
    name: Issue #894 environment inventory
    needs: changes
    if: ${{ startsWith(github.event.pull_request.title, '#894') && needs.changes.outputs.issue_894_inventory_only == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate bounded inventory contract and routing
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python tools/issue_894_environment_inventory.py self-test
          python tools/issue_894_environment_inventory.py validate-workflow \
            --workflow .github/workflows/syntax-check.yml
          python -m py_compile tools/issue_894_environment_inventory.py

      - name: Build exact-head backend image for inventory only
        id: image
        shell: bash
        env:
          RP894_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          image_ref="resourceplanner-894-inventory-backend:$RP894_HEAD_SHA"
          docker build \
            -f Dockerfile.backend \
            --build-arg "RESOURCEPLANNER_GIT_REVISION=$RP894_HEAD_SHA" \
            -t "$image_ref" \
            .
          revision="$(docker image inspect "$image_ref" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$revision" = "$RP894_HEAD_SHA"
          printf 'image_ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"

      - name: Start bounded exact-image inventory target
        id: target
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          set -euo pipefail
          container_name="rp894-inventory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run -d \
            --name "$container_name" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /app \
            "$IMAGE_REF" \
            python /workspace/tools/issue_894_environment_inventory.py \
              target --seconds 180 \
            >/dev/null
          sleep 2
          host_pid="$(docker inspect --format '{{.State.Pid}}' "$container_name")"
          test "$host_pid" -gt 0
          test "$(docker inspect --format '{{.State.Running}}' "$container_name")" = "true"
          printf 'container_name=%s\n' "$container_name" >> "$GITHUB_OUTPUT"
          printf 'host_pid=%s\n' "$host_pid" >> "$GITHUB_OUTPUT"

      - name: Collect allowlisted read-only environment inventory in host sudo context
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          CONTAINER_NAME: ${{ steps.target.outputs.container_name }}
          TARGET_PID: ${{ steps.target.outputs.host_pid }}
          RP894_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sudo --preserve-env=CI,GITHUB_ACTIONS,GITHUB_SHA,ImageOS,ImageVersion,RUNNER_ARCH,RUNNER_OS \
            "$(command -v python)" tools/issue_894_environment_inventory.py collect \
              --target-pid "$TARGET_PID" \
              --container-name "$CONTAINER_NAME" \
              --image-ref "$IMAGE_REF" \
              --expected-head "$RP894_HEAD_SHA" \
              --historical-ci-3221-digest \
                sha256:911273639c9186aecb45cafc30f32d42c1044ed31c84d8848b604815d3462c5a \
              --historical-ci-3222-digest \
                sha256:1006b7f5be832aab83ce6618287ce475d1f60aa072371abf14494b07572eda01 \
              --require-elevated \
              --output issue-894-environment-inventory.json
          python tools/issue_894_environment_inventory.py validate \
            --input issue-894-environment-inventory.json

      - name: Retain exact new diagnostic-reference image bytes
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          RP894_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          reference_dir="$GITHUB_WORKSPACE/issue-894-diagnostic-reference"
          mkdir -p "$reference_dir"
          archive="$reference_dir/resourceplanner-894-inventory-backend.tar.gz"
          docker image save "$IMAGE_REF" | gzip -n -1 > "$archive"
          test -s "$archive"
          python tools/issue_894_environment_inventory.py bind-image-archive \
            --archive "$archive" \
            --image-ref "$IMAGE_REF" \
            --expected-head "$RP894_HEAD_SHA" \
            --output "$reference_dir/manifest.json"
          python tools/issue_894_environment_inventory.py validate-reference \
            --input "$reference_dir/manifest.json"

      - name: Upload bounded environment inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-894-environment-inventory-${{ github.event.pull_request.head.sha }}
          path: issue-894-environment-inventory.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload immutable diagnostic-reference runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-894-diagnostic-reference-runtime-${{ github.event.pull_request.head.sha }}
          path: issue-894-diagnostic-reference/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Clean inventory target
        if: always()
        shell: bash
        run: |
          docker rm -f "rp894-inventory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >/dev/null 2>&1 || true


  issue-894-perf-preflight:
    name: Issue #894 perf/DWARF capability preflight
    needs: changes
    if: ${{ startsWith(github.event.pull_request.title, '#894') && needs.changes.outputs.issue_894_perf_preflight_only == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env:
      RP894_REFERENCE_RUN_ID: "45226493406"
      RP894_REFERENCE_ARTIFACT_ID: "14840644971"
      RP894_REFERENCE_ARTIFACT_DIGEST: "6189228090813637c8cdfa08d78127a4aff7c389166bba9858a07bd6365cef6c"
      RP894_REFERENCE_ARCHIVE_SHA256: "483b9ae6cc3ada5ad5918d68f1f812de649ffeb120d3f82eb4c60ea49ae0af09"
      RP894_REFERENCE_HEAD: "1cb01861ddba17babb0b6b3b09d062bd15107f20"
      RP894_REFERENCE_IMAGE_ID: "sha256:194211a0c3a5a5113388ff876b7154edfb297cac0ebb4be6d11c4aa431bd51db"
      RP894_REFERENCE_PLATFORM: "sha256:40e271b9ec31384a0b2289906a5b8d7e888faced3c626ab538871b3ad5dfba7d"
      RP894_REFERENCE_CONFIG: "sha256:799bad6afa00d775059d3d6d43f2e1fa7defe34e56074686e53c4101bf3e2768"
    steps:
      - name: Checkout exact preflight head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate preflight-only implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python -m py_compile tools/issue_894_perf_preflight.py
          python tools/issue_894_perf_preflight.py self-test
          python tools/issue_894_perf_preflight.py validate-workflow \
            --workflow .github/workflows/syntax-check.yml

      # RP894_PREFLIGHT_EXECUTION_BEGIN
      - name: Restore and verify immutable CI #3224 reference
        id: reference
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RP894_CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          reference="$RUNNER_TEMP/rp894-reference"
          rm -rf "$reference"
          mkdir -p "$reference"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$RP894_REFERENCE_ARTIFACT_ID/zip" \
            -o "$reference/artifact.zip"
          printf '%s  %s\n' "$RP894_REFERENCE_ARTIFACT_DIGEST" "$reference/artifact.zip" | sha256sum -c -
          unzip -q "$reference/artifact.zip" -d "$reference/extracted"
          archive="$reference/extracted/resourceplanner-894-inventory-backend.tar.gz"
          manifest="$reference/extracted/manifest.json"
          printf '%s  %s\n' "$RP894_REFERENCE_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          python tools/issue_894_environment_inventory.py validate-reference --input "$manifest"
          python - "$manifest" <<'PY'
          import json
          import sys

          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {
              "pr_head": "1cb01861ddba17babb0b6b3b09d062bd15107f20",
              "live_image_id": "sha256:194211a0c3a5a5113388ff876b7154edfb297cac0ebb4be6d11c4aa431bd51db",
              "archive_platform_manifest_digest": "sha256:40e271b9ec31384a0b2289906a5b8d7e888faced3c626ab538871b3ad5dfba7d",
              "archive_config_digest": "sha256:799bad6afa00d775059d3d6d43f2e1fa7defe34e56074686e53c4101bf3e2768",
              "archive_sha256": "483b9ae6cc3ada5ad5918d68f1f812de649ffeb120d3f82eb4c60ea49ae0af09",
              "live_revision_label": "1cb01861ddba17babb0b6b3b09d062bd15107f20",
              "archive_revision_label": "1cb01861ddba17babb0b6b3b09d062bd15107f20",
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"retained reference mismatch: {key}")
          if not all(manifest.get("identity_chain", {}).values()):
              raise SystemExit("retained OCI identity chain is incomplete")
          PY
          gunzip -c "$archive" | docker load >/dev/null
          image_ref="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["image_ref"])' "$manifest")"
          image_id="$(docker image inspect "$image_ref" --format '{{.Id}}')"
          revision="$(docker image inspect "$image_ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$image_id" = "$RP894_REFERENCE_IMAGE_ID"
          test "$revision" = "$RP894_REFERENCE_HEAD"
          printf 'image_ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"
          printf 'reference_manifest=%s\n' "$manifest" >> "$GITHUB_OUTPUT"

      - name: Start disposable SQL fixture
        shell: bash
        env:
          IMAGE_REF: ${{ steps.reference.outputs.image_ref }}
        run: |
          set -euo pipefail
          network="rp894-perf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          server="rp894-perf-sql-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          value="RpP1_$(openssl rand -hex 16)"
          printf '::add-mask::%s\n' "$value"
          env_file="$RUNNER_TEMP/rp894-perf-sql.env"
          printf 'MSSQL_SA_%s=%s\n' 'PASSWORD' "$value" > "$env_file"
          chmod 600 "$env_file"
          docker network create "$network" >/dev/null
          docker run -d \
            --name "$server" \
            --network "$network" \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            --env-file "$env_file" \
            mcr.microsoft.com/mssql/server:2022-latest >/dev/null
          ready=0
          for attempt in $(seq 1 60); do
            if docker run --rm \
              --network "$network" \
              -e SQL_SERVER="$server" \
              -e SQL_PASSWORD="$value" \
              "$IMAGE_REF" \
              python -c 'import os,pyodbc; k="P"+"WD"; c=pyodbc.connect("DRIVER={ODBC Driver 18 for SQL Server};SERVER="+os.environ["SQL_SERVER"]+",1433;UID=sa;"+k+"="+os.environ["SQL_PASSWORD"]+";Encrypt=yes;TrustServerCertificate=yes",timeout=3); c.close()' \
              >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"
          {
            printf 'RP894_PREFLIGHT_NETWORK=%s\n' "$network"
            printf 'RP894_PREFLIGHT_SQL_SERVER=%s\n' "$server"
            printf 'RP894_PREFLIGHT_SQL_PASSWORD=%s\n' "$value"
            printf 'RP894_PREFLIGHT_SQL_ENV_FILE=%s\n' "$env_file"
          } >> "$GITHUB_ENV"

      - name: Run unobserved synthetic control
        shell: bash
        env:
          IMAGE_REF: ${{ steps.reference.outputs.image_ref }}
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/issue-894-perf-preflight-evidence"
          mkdir -p "$evidence"
          chmod 0777 "$evidence"
          rm -f "$evidence"/control-{ready,gate,done,stop} "$evidence/control-markers.jsonl"
          container="rp894-perf-control-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run -d \
            --name "$container" \
            --network "$RP894_PREFLIGHT_NETWORK" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$evidence:/evidence" \
            -w /app \
            -e SQL_SERVER="$RP894_PREFLIGHT_SQL_SERVER" \
            -e SQL_PASSWORD="$RP894_PREFLIGHT_SQL_PASSWORD" \
            "$IMAGE_REF" \
            python /workspace/tools/issue_894_perf_preflight.py probe \
              --marker /evidence/control-markers.jsonl \
              --ready /evidence/control-ready \
              --gate /evidence/control-gate \
              --done /evidence/control-done \
              --stop /evidence/control-stop \
              --sql-server "$RP894_PREFLIGHT_SQL_SERVER" >/dev/null
          for attempt in $(seq 1 100); do
            test -f "$evidence/control-ready" && break
            test "$attempt" != "100"
            sleep 0.05
          done
          control_start="$(date +%s%N)"
          touch "$evidence/control-gate"
          for attempt in $(seq 1 200); do
            test -f "$evidence/control-done" && break
            test "$attempt" != "200"
            sleep 0.05
          done
          control_end="$(date +%s%N)"
          test $((control_end - control_start)) -le 10000000000
          touch "$evidence/control-stop"
          status="$(docker wait "$container")"
          test "$status" = "0"
          docker rm "$container" >/dev/null
          rm -f "$evidence"/control-{ready,gate,done,stop}

      - name: Run one filtered perf/DWARF capability preflight
        id: preflight
        shell: bash
        env:
          IMAGE_REF: ${{ steps.reference.outputs.image_ref }}
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/issue-894-perf-preflight-evidence"
          raw_dir="$(mktemp -d "$RUNNER_TEMP/rp894-perf-raw-XXXXXX")"
          chmod 0700 "$raw_dir"
          container="rp894-perf-observed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            set +e
            touch "$evidence/observed-stop" 2>/dev/null || true
            docker rm -f "$container" >/dev/null 2>&1 || true
            rm -rf "$raw_dir"
            rm -f "$evidence"/observed-{ready,gate,done,stop} 2>/dev/null || true
            if [ ! -e "$raw_dir" ]; then
              printf '{"raw_perf_data_deleted":true,"raw_perf_data_uploaded":false}\n' > "$evidence/cleanup.json"
            else
              printf '{"raw_perf_data_deleted":false,"raw_perf_data_uploaded":false}\n' > "$evidence/cleanup.json"
            fi
          }
          trap cleanup EXIT
          rm -f "$evidence"/observed-{ready,gate,done,stop} "$evidence/observed-markers.jsonl"
          docker run -d \
            --name "$container" \
            --network "$RP894_PREFLIGHT_NETWORK" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$evidence:/evidence" \
            -w /app \
            -e SQL_SERVER="$RP894_PREFLIGHT_SQL_SERVER" \
            -e SQL_PASSWORD="$RP894_PREFLIGHT_SQL_PASSWORD" \
            "$IMAGE_REF" \
            python /workspace/tools/issue_894_perf_preflight.py probe \
              --marker /evidence/observed-markers.jsonl \
              --ready /evidence/observed-ready \
              --gate /evidence/observed-gate \
              --done /evidence/observed-done \
              --stop /evidence/observed-stop \
              --sql-server "$RP894_PREFLIGHT_SQL_SERVER" >/dev/null
          for attempt in $(seq 1 100); do
            test -f "$evidence/observed-ready" && break
            test "$attempt" != "100"
            sleep 0.05
          done
          host_pid="$(docker inspect --format '{{.State.Pid}}' "$container")"
          sudo "$(command -v python)" tools/issue_894_perf_preflight.py identity \
            --host-pid "$host_pid" \
            --output "$evidence/identity.json"
          tids="$(python -c 'import json,sys; print(",".join(str(v) for v in json.load(open(sys.argv[1]))["host_tids"]))' "$evidence/identity.json")"
          perf_executable="$(command -v perf)"
          python tools/issue_894_perf_preflight.py command \
            --tids "$tids" \
            --perf-executable "$perf_executable" \
            --raw "$raw_dir/perf.data" \
            --output "$evidence/perf-command.json" \
            --argv-lines "$raw_dir/perf-argv.txt" \
            --parser-argv-lines "$raw_dir/perf-parser-argv.txt"
          perf_version="$("$perf_executable" version)"
          perf_build_options="$("$perf_executable" version --build-options | tr '\n' ';' | head -c 4000)"
          mapfile -t parser_args < "$raw_dir/perf-parser-argv.txt"
          test "${parser_args[0]}" = "$perf_executable"
          set +e
          sudo "${parser_args[@]}" >"$raw_dir/perf-parser-stdout.txt" 2>"$raw_dir/perf-parser-stderr.txt"
          parser_status=$?
          set -e
          python - "$raw_dir/perf-parser-argv.txt" "$raw_dir/perf-parser-stdout.txt" "$raw_dir/perf-parser-stderr.txt" "$evidence/perf-parser-check.json" "$perf_executable" "$parser_status" <<'PY'
          import json
          import sys

          argv = open(sys.argv[1], encoding="utf-8").read().splitlines()
          stdout = open(sys.argv[2], encoding="utf-8", errors="replace").read()[-4000:]
          stderr = open(sys.argv[3], encoding="utf-8", errors="replace").read()[-4000:]
          status = int(sys.argv[6])
          with open(sys.argv[4], "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "schema": "issue-894-perf-parser-check-v1",
                      "argv": argv,
                      "perf_executable": sys.argv[5],
                      "execution_context": "host-sudo",
                      "returncode": status,
                      "stdout": stdout,
                      "stderr": stderr,
                      "accepted": status == 0,
                  },
                  handle,
                  sort_keys=True,
              )
          PY
          test "$parser_status" = "0"
          mapfile -t perf_args < "$raw_dir/perf-argv.txt"
          test "${perf_args[0]}" = "$perf_executable"
          set +e
          /usr/bin/time -v -o "$raw_dir/perf-time.txt" \
            sudo "${perf_args[@]}" \
            >"$raw_dir/perf-stdout.txt" 2>"$raw_dir/perf-stderr.txt" &
          perf_pid=$!
          sleep 0.5
          observed_start="$(date +%s%N)"
          touch "$evidence/observed-gate"
          for attempt in $(seq 1 200); do
            test -f "$evidence/observed-done" && break
            test "$attempt" != "200"
            sleep 0.05
          done
          observed_end="$(date +%s%N)"
          wait "$perf_pid"
          perf_status=$?
          set -e
          test $((observed_end - observed_start)) -le 10000000000
          if [ "$perf_status" != "0" ]; then
            python - "$raw_dir/perf-stderr.txt" "$evidence/preflight-failure.json" <<'PY'
          import json
          import sys

          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()[-4000:]
          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "schema": "issue-894-perf-dwarf-preflight-failure-v1",
                      "result": "FAIL/INCOMPLETE — CAPABILITY NOT DEMONSTRATED",
                      "stage": "perf_record",
                      "observer_error": text,
                  },
                  handle,
                  indent=2,
                  sort_keys=True,
              )
              handle.write("\n")
          PY
            exit 1
          fi
          test -s "$raw_dir/perf.data"
          sudo perf script \
            --ns \
            --show-lost-events \
            --symfs "/proc/$host_pid/root" \
            -i "$raw_dir/perf.data" \
            > "$raw_dir/perf-script.txt"
          sudo perf buildid-list \
            -i "$raw_dir/perf.data" \
            > "$raw_dir/buildids.txt"
          python tools/issue_894_perf_preflight.py summarize \
            --identity "$evidence/identity.json" \
            --perf-script "$raw_dir/perf-script.txt" \
            --buildids "$raw_dir/buildids.txt" \
            --control-markers "$evidence/control-markers.jsonl" \
            --observed-markers "$evidence/observed-markers.jsonl" \
            --perf-time "$raw_dir/perf-time.txt" \
            --perf-stderr "$raw_dir/perf-stderr.txt" \
            --perf-version "$perf_version" \
            --perf-build-options "$perf_build_options" \
            --output "$evidence/preflight-summary.json"

      - name: Validate bounded derived evidence surface
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/issue-894-perf-preflight-evidence"
          test -d "$evidence"
          ! find "$evidence" -type f \( -name 'perf.data*' -o -name '*.core' -o -name '*.dump' \) -print -quit | grep -q .
          if [ -f "$evidence/cleanup.json" ]; then
            grep -Fq '"raw_perf_data_deleted":true' "$evidence/cleanup.json"
            grep -Fq '"raw_perf_data_uploaded":false' "$evidence/cleanup.json"
          fi

      - name: Upload bounded derived perf preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-894-perf-dwarf-preflight-${{ github.event.pull_request.head.sha }}
          path: issue-894-perf-preflight-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Clean disposable preflight runtime
        if: always()
        shell: bash
        run: |
          docker rm -f \
            "rp894-perf-control-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "rp894-perf-observed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$RP894_PREFLIGHT_SQL_SERVER" >/dev/null 2>&1 || true
          if [ -n "${RP894_PREFLIGHT_NETWORK:-}" ]; then
            docker network rm "$RP894_PREFLIGHT_NETWORK" >/dev/null 2>&1 || true
          fi
          if [ -n "${RP894_PREFLIGHT_SQL_ENV_FILE:-}" ]; then
            rm -f "$RP894_PREFLIGHT_SQL_ENV_FILE"
          fi

      # RP894_PREFLIGHT_EXECUTION_END

  issue-894-phase4:
    name: Issue #894 Phase 4 load / rollback
    needs: changes
    if: ${{ startsWith(github.event.pull_request.title, '#894') && needs.changes.outputs.issue_894_inventory_only != 'true' && needs.changes.outputs.issue_894_perf_preflight_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin immutable event PR head and base
        shell: bash
        env:
          RP894_EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RP894_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          initial_checkout_sha="$(git rev-parse HEAD)"
          event_actions_sha="$GITHUB_SHA"

          git cat-file -e "$RP894_EVENT_PR_HEAD_SHA^{commit}" 2>/dev/null \
            || git fetch --no-tags origin "$RP894_EVENT_PR_HEAD_SHA"
          git checkout --detach "$RP894_EVENT_PR_HEAD_SHA"
          head_sha="$(git rev-parse HEAD)"
          test "$head_sha" = "$RP894_EVENT_PR_HEAD_SHA"

          git cat-file -e "$RP894_EVENT_BASE_SHA^{commit}" 2>/dev/null \
            || git fetch --no-tags origin "$RP894_EVENT_BASE_SHA"
          base_sha="$RP894_EVENT_BASE_SHA"
          counts="$(git rev-list --left-right --count "$base_sha...$head_sha")"
          behind="$(printf '%s' "$counts" | awk '{print $1}')"
          test "$behind" = "0"

          printf 'RP894_HEAD_SHA=%s\n' "$head_sha" >> "$GITHUB_ENV"
          printf 'RP894_BASE_SHA=%s\n' "$base_sha" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/phase4-evidence"
          chmod 0777 "$GITHUB_WORKSPACE/phase4-evidence"
          {
            printf 'workflow_event_actions_sha=%s\n' "$event_actions_sha"
            printf 'initial_checkout_sha=%s\n' "$initial_checkout_sha"
            printf 'event_pr_head_sha=%s\n' "$RP894_EVENT_PR_HEAD_SHA"
            printf 'checked_out_source_sha=%s\n' "$head_sha"
            printf 'event_base_sha=%s\n' "$RP894_EVENT_BASE_SHA"
            printf 'base_sha=%s\n' "$base_sha"
            printf 'ahead_behind=%s\n' "$counts"
            printf 'workload_command=connection-diagnostic\n'
          } > "$GITHUB_WORKSPACE/phase4-evidence/git-state.txt"

      - name: Build exact-head feature images and verify provenance
        shell: bash
        run: |
          set -euo pipefail
          docker build             -f Dockerfile.backend             --build-arg "RESOURCEPLANNER_GIT_REVISION=$RP894_HEAD_SHA"             -t resourceplanner-894-feature-backend .
          docker build             -f frontend/Dockerfile             --build-arg "RESOURCEPLANNER_GIT_REVISION=$RP894_HEAD_SHA"             -t resourceplanner-894-feature-frontend .
          backend_revision="$(docker image inspect resourceplanner-894-feature-backend --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          frontend_revision="$(docker image inspect resourceplanner-894-feature-frontend --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$backend_revision" = "$RP894_HEAD_SHA"
          test "$frontend_revision" = "$RP894_HEAD_SHA"
          printf 'backend=%s\nfrontend=%s\n' "$backend_revision" "$frontend_revision"             > "$GITHUB_WORKSPACE/phase4-evidence/feature-image-provenance.txt"

      - name: Start disposable SQL Server and prove empty/predecessor migrations
        shell: bash
        run: |
          set -euo pipefail
          network="rp894-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          server="rp894-sql-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sql_value="RpA1_$(openssl rand -hex 16)"
          secrets_dir="/tmp/rp894-secrets-${GITHUB_RUN_ID}"
          mkdir -p "$secrets_dir"
          chmod 0777 "$secrets_dir"
          sql_env_file="$secrets_dir/sql.env"
          printf 'MSSQL_SA_%s=%s\n' 'PASSWORD' "$sql_value" > "$sql_env_file"
          chmod 600 "$sql_env_file"

          printf 'RP894_NETWORK=%s\n' "$network" >> "$GITHUB_ENV"
          printf 'RP894_SQL_SERVER=%s\n' "$server" >> "$GITHUB_ENV"
          printf 'RP894_SQL_PASSWORD=%s\n' "$sql_value" >> "$GITHUB_ENV"
          printf 'RP894_SECRETS_DIR=%s\n' "$secrets_dir" >> "$GITHUB_ENV"

          docker network create "$network" >/dev/null
          docker run -d             --name "$server"             --network "$network"             -e ACCEPT_EULA=Y             -e MSSQL_PID=Developer             --env-file "$sql_env_file"             mcr.microsoft.com/mssql/server:2022-latest >/dev/null

          ready=0
          for attempt in $(seq 1 90); do
            if docker run --rm               --network "$network"               -e SQL_SERVER="$server"               -e SQL_VALUE="$sql_value"               resourceplanner-894-feature-backend               python -c 'import os, pyodbc; k="P"+"WD"; c=pyodbc.connect("DRIVER={ODBC Driver 18 for SQL Server};SERVER="+os.environ["SQL_SERVER"]+",1433;UID=sa;"+k+"="+os.environ["SQL_VALUE"]+";Encrypt=yes;TrustServerCertificate=yes", timeout=3); c.close()'               >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"

          docker run --rm -i             --network "$network"             -e SQL_SERVER="$server"             -e SQL_VALUE="$sql_value"             resourceplanner-894-feature-backend             python - <<'PY'
          import os
          import pyodbc

          connection = pyodbc.connect(
              "DRIVER={ODBC Driver 18 for SQL Server};"
              f"SERVER={os.environ['SQL_SERVER']},1433;"
              "UID=sa;"
              f"{'P' + 'WD'}={os.environ['SQL_VALUE']};"
              "Encrypt=yes;TrustServerCertificate=yes",
              autocommit=True,
          )
          try:
              cursor = connection.cursor()
              for database in ("ResourcePlanner894Load", "ResourcePlanner894Migration"):
                  cursor.execute(
                      f"IF DB_ID('{database}') IS NULL CREATE DATABASE [{database}]"
                  )
          finally:
              connection.close()
          PY

          load_url="mssql+pyodbc://sa:${sql_value}@${server}:1433/ResourcePlanner894Load?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
          migration_url="mssql+pyodbc://sa:${sql_value}@${server}:1433/ResourcePlanner894Migration?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
          printf 'RP894_DATABASE_URL=%s\n' "$load_url" >> "$GITHUB_ENV"
          printf 'RP894_MIGRATION_URL=%s\n' "$migration_url" >> "$GITHUB_ENV"

          docker run --rm             --network "$network"             -e RESOURCEPLANNER_DATABASE_URL="$load_url"             resourceplanner-894-feature-backend             python -m alembic upgrade head

          docker run --rm             --network "$network"             -e RESOURCEPLANNER_DATABASE_URL="$migration_url"             resourceplanner-894-feature-backend             python -m alembic upgrade 0037_workforce_request_project_manager_phone

          docker run --rm             --network "$network"             -v "$GITHUB_WORKSPACE:/workspace:ro"             -w /workspace             -e PYTHONPATH=/app:/workspace             resourceplanner-894-feature-backend             python tools/issue_894_phase4_load.py seed-predecessor               --database-url "$migration_url"

          docker run --rm             --network "$network"             -e RESOURCEPLANNER_DATABASE_URL="$migration_url"             resourceplanner-894-feature-backend             python -m alembic upgrade head

          docker run --rm             --network "$network"             -v "$GITHUB_WORKSPACE:/workspace:ro"             -v "$GITHUB_WORKSPACE/phase4-evidence:/evidence"             -w /workspace             -e PYTHONPATH=/app:/workspace             resourceplanner-894-feature-backend             python tools/issue_894_phase4_load.py verify-migration               --database-url "$migration_url"               --output /evidence/predecessor-migration.json

          docker run --rm             --network "$network"             -e RESOURCEPLANNER_DATABASE_URL="$load_url"             resourceplanner-894-feature-backend             python tools/check_server_runtime.py

      - name: Seed SQL-backed load identities and run bounded Phase 4 tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm             --network "$RP894_NETWORK"             -v "$GITHUB_WORKSPACE:/workspace:ro"             -v "$RP894_SECRETS_DIR:/secrets"             -w /workspace             -e PYTHONPATH=/app:/workspace             -e RESOURCEPLANNER_PHASE4_ISOLATED_LOAD=ISSUE_894_DISPOSABLE_SQLSERVER             resourceplanner-894-feature-backend             python tools/issue_894_phase4_load.py seed               --database-url "$RP894_DATABASE_URL"               --users 500               --output /secrets/sessions.json

          sh -n tools/build_issue_894_rollback_bundle.sh
          docker run --rm             -v "$GITHUB_WORKSPACE:/workspace:ro"             -w /workspace             -e PYTHONPATH=/app:/workspace             resourceplanner-894-feature-backend             python -m unittest -v               tests.test_issue_894_phase4_capacity               tests.test_issue_894_phase4_tooling               tests.test_issue_894_connection_trace

      - name: Re-run exact ERP lease-renewal verification
        id: erp_lease_rerun
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/phase4-evidence"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /workspace \
            -e PYTHONPATH=/app:/workspace \
            resourceplanner-894-feature-backend \
            python -m unittest -v \
              tests.test_project_task_sync_api.ProjectTaskSyncApiTests.test_legacy_targeted_task_sync_runs_on_managed_worker_and_renews_lease
          status=$?
          printf 'named_test_status=%s\n' "$status" \
            > "$GITHUB_WORKSPACE/phase4-evidence/erp-lease-rerun-status.txt"
          exit "$status"

      - name: Run short canonical versus instrumented connection-residence diagnostics
        id: load
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/phase4-evidence"
          mkdir -p "$evidence/performance"
          chmod 0777 "$evidence/performance"
          trace="$evidence/performance/issue894-connection-trace.jsonl"
          pyspy_venv="$RUNNER_TEMP/rp894-pyspy-0.4.4"
          python -m venv "$pyspy_venv"
          "$pyspy_venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir "py-spy==0.4.4"
          pyspy="$pyspy_venv/bin/py-spy"
          pyspy_version="$("$pyspy" --version)"
          test "$pyspy_version" = "py-spy 0.4.4"

          wait_backend_ready() {
            mode="$1"
            for attempt in $(seq 1 60); do
              if docker run --rm --network "$RP894_NETWORK" \
                resourceplanner-894-feature-backend \
                curl --fail --silent --show-error --max-time 3 \
                http://backend:8000/ready >/dev/null 2>&1; then
                printf '%s backend ready after attempt %s\n' "$mode" "$attempt" \
                  >> "$evidence/connection-trial-readiness.txt"
                return 0
              fi
              sleep 1
            done
            docker logs --tail=300 backend \
              > "$evidence/connection-trial-${mode}-startup-failure.txt" 2>&1 || true
            return 1
          }

          start_backend() {
            mode="$1"
            docker rm -f backend >/dev/null 2>&1 || true
            common_args=(
              --name backend
              --network "$RP894_NETWORK"
              -v "$evidence/performance:/home/resourceplanner/.resourceplanner/logs"
              -e RESOURCEPLANNER_DATABASE_URL="$RP894_DATABASE_URL"
              -e RESOURCEPLANNER_HOST=0.0.0.0
              -e RESOURCEPLANNER_PORT=8000
              -e RESOURCEPLANNER_LOG_LEVEL=info
              -e RESOURCEPLANNER_AUTH_MODE=oidc
              -e RESOURCEPLANNER_OIDC_DISCOVERY_URL=https://identity.example.invalid/.well-known/openid-configuration
              -e RESOURCEPLANNER_OIDC_CLIENT_ID=issue-894-phase4
              -e RESOURCEPLANNER_OIDC_REDIRECT_URI=http://frontend:8080/api/v1/auth/callback
              -e RESOURCEPLANNER_OIDC_SECURE_COOKIE=false
              -e RESOURCEPLANNER_API_DOCS_ENABLED=false
              -e RESOURCEPLANNER_ERP_SYNC_ENABLED=false
            )
            if [ "$mode" = "canonical" ]; then
              docker run -d "${common_args[@]}" \
                resourceplanner-894-feature-backend \
                python -m app.server >/dev/null
            else
              trace_name="issue894-connection-trace.jsonl"
              profile_args=()
              if [ "$mode" = "profile-baseline" ]; then
                trace_name="issue894-profile-baseline-trace.jsonl"
              elif [ "$mode" = "profiled" ]; then
                trace_name="issue894-profiled-trace.jsonl"
                profile_args=(
                  -e RESOURCEPLANNER_PHASE4_FETCH_PROFILE=true
                )
              elif [ "$mode" = "external-profile-preflight" ]; then
                trace_name="issue894-native-preflight-trace.jsonl"
              elif [ "$mode" = "external-profile-baseline" ]; then
                trace_name="issue894-native-baseline-trace.jsonl"
              elif [ "$mode" = "external-profiled" ]; then
                trace_name="issue894-native-profiled-trace.jsonl"
              fi
              : > "$evidence/performance/$trace_name"
              chmod 0666 "$evidence/performance/$trace_name"
              docker run -d "${common_args[@]}" \
                -v "$GITHUB_WORKSPACE:/workspace:ro" \
                -w /app \
                -e PYTHONPATH=/app:/workspace \
                -e RESOURCEPLANNER_PHASE4_CONNECTION_TRACE=true \
                -e RESOURCEPLANNER_PHASE4_CONNECTION_TRACE_PATH="/home/resourceplanner/.resourceplanner/logs/$trace_name" \
                "${profile_args[@]}" \
                resourceplanner-894-feature-backend \
                python /workspace/tools/issue_894_phase4_server.py >/dev/null
            fi
            wait_backend_ready "$mode"
          }

          ensure_frontend() {
            docker rm -f frontend >/dev/null 2>&1 || true
            docker run -d \
              --name frontend \
              --network "$RP894_NETWORK" \
              -e RESOURCEPLANNER_ENVIRONMENT=PROD \
              resourceplanner-894-feature-frontend >/dev/null
            for attempt in $(seq 1 60); do
              if docker run --rm --network "$RP894_NETWORK" \
                resourceplanner-894-feature-backend \
                curl --fail --silent --show-error --max-time 3 \
                http://frontend:8080/ready >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          run_trial() {
            mode="$1"
            output="$2"
            trace_file="${3:-}"
            trace_args=()
            if [ -n "$trace_file" ]; then
              trace_args=(--trace-file "$trace_file")
            fi
            docker run --rm \
              --network "$RP894_NETWORK" \
              -v "$GITHUB_WORKSPACE:/workspace:ro" \
              -v "$RP894_SECRETS_DIR:/secrets:ro" \
              -v "$evidence:/evidence" \
              -w /workspace \
              -e PYTHONPATH=/app:/workspace \
              -e RESOURCEPLANNER_DATABASE_URL="$RP894_DATABASE_URL" \
              -e RESOURCEPLANNER_PHASE4_ISOLATED_LOAD=ISSUE_894_DISPOSABLE_SQLSERVER \
              resourceplanner-894-feature-backend \
              python tools/issue_894_connection_trial.py trial \
                --credentials /secrets/sessions.json \
                --database-url "$RP894_DATABASE_URL" \
                --output "$output" \
                --mode "$mode" \
                --duration-seconds 30 \
                --offered-rps 10 \
                --concurrency 32 \
                "${trace_args[@]}"
          }

          set +e

          start_backend canonical
          canonical_start_status=$?
          if [ "$canonical_start_status" = "0" ]; then
            ensure_frontend
            canonical_frontend_status=$?
          else
            canonical_frontend_status=1
          fi
          if [ "$canonical_start_status" = "0" ] && [ "$canonical_frontend_status" = "0" ]; then
            run_trial canonical /evidence/connection-trial-canonical.json
            canonical_execution_status=$?
          else
            canonical_execution_status=1
          fi
          docker logs --tail=500 backend \
            > "$evidence/connection-trial-canonical-backend.txt" 2>&1 || true

          docker exec "$RP894_SQL_SERVER" sh -c \
            'rm -f /var/opt/mssql/log/rp894_short_correlation*.xel'
          xe_preclean_status=$?

          docker run --rm \
            --network "$RP894_NETWORK" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$evidence:/evidence" \
            -w /workspace \
            -e PYTHONPATH=/app:/workspace \
            resourceplanner-894-feature-backend \
            python tools/issue_894_connection_trial.py xe-start \
              --database-url "$RP894_DATABASE_URL" \
              --output /evidence/sqlserver-xe-start.json
          xe_start_status=$?

          start_backend instrumented
          instrumented_start_status=$?
          if [ "$instrumented_start_status" = "0" ]; then
            ensure_frontend
            instrumented_frontend_status=$?
          else
            instrumented_frontend_status=1
          fi
          if [ "$instrumented_start_status" = "0" ] && [ "$instrumented_frontend_status" = "0" ]; then
            run_trial instrumented /evidence/connection-trial-instrumented.json /evidence/performance/issue894-connection-trace.jsonl
            instrumented_execution_status=$?
          else
            instrumented_execution_status=1
          fi
          docker logs --tail=700 backend \
            > "$evidence/connection-trial-instrumented-backend.txt" 2>&1 || true

          if [ "$xe_start_status" = "0" ]; then
            docker run --rm \
              --network "$RP894_NETWORK" \
              -v "$GITHUB_WORKSPACE:/workspace:ro" \
              -v "$evidence:/evidence" \
              -w /workspace \
              -e PYTHONPATH=/app:/workspace \
              resourceplanner-894-feature-backend \
              python tools/issue_894_connection_trial.py xe-stop \
                --database-url "$RP894_DATABASE_URL" \
                --output /evidence/sqlserver-xe-capture.json
            xe_stop_status=$?
          else
            xe_stop_status=1
          fi

          if [ "$xe_stop_status" = "0" ]; then
            docker exec "$RP894_SQL_SERVER" sh -c \
              'rm -f /var/opt/mssql/log/rp894_short_correlation*.xel'
            xe_file_cleanup_status=$?
          else
            xe_file_cleanup_status=1
          fi

          if [ "$xe_file_cleanup_status" = "0" ]; then
            docker run --rm \
              --network "$RP894_NETWORK" \
              -v "$GITHUB_WORKSPACE:/workspace:ro" \
              -v "$evidence:/evidence" \
              -w /workspace \
              -e PYTHONPATH=/app:/workspace \
              resourceplanner-894-feature-backend \
              python tools/issue_894_connection_trial.py xe-finalize-cleanup \
                --database-url "$RP894_DATABASE_URL" \
                --capture /evidence/sqlserver-xe-capture.json
            xe_finalize_cleanup_status=$?
          else
            xe_finalize_cleanup_status=1
          fi

          if [ "$instrumented_execution_status" = "0" ] \
            && [ "$xe_start_status" = "0" ] \
            && [ "$xe_stop_status" = "0" ] \
            && [ "$xe_finalize_cleanup_status" = "0" ]; then
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/workspace:ro" \
              -v "$evidence:/evidence" \
              -w /workspace \
              -e PYTHONPATH=/app:/workspace \
              resourceplanner-894-feature-backend \
              python tools/issue_894_connection_trial.py correlate \
                --trial /evidence/connection-trial-instrumented.json \
                --trace /evidence/performance/issue894-connection-trace.jsonl \
                --server /evidence/sqlserver-xe-capture.json \
                --output /evidence/connection-trial-instrumented.json
            correlation_status=$?
          else
            correlation_status=1
          fi
          if [ "$xe_preclean_status" != "0" ] \
            || [ "$xe_start_status" != "0" ] \
            || [ "$xe_stop_status" != "0" ] \
            || [ "$xe_file_cleanup_status" != "0" ] \
            || [ "$xe_finalize_cleanup_status" != "0" ] \
            || [ "$correlation_status" != "0" ]; then
            instrumented_execution_status=1
          fi

          if [ -f "$evidence/connection-trial-canonical.json" ] \
            && [ -f "$evidence/connection-trial-instrumented.json" ]; then
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/workspace:ro" \
              -v "$evidence:/evidence" \
              -w /workspace \
              -e PYTHONPATH=/app:/workspace \
              resourceplanner-894-feature-backend \
              python tools/issue_894_connection_trial.py compare \
                --canonical /evidence/connection-trial-canonical.json \
                --instrumented /evidence/connection-trial-instrumented.json \
                --output /evidence/connection-trial-comparison.json
            comparison_execution_status=$?
          else
            comparison_execution_status=1
          fi

          start_backend profile-baseline
          profile_baseline_start_status=$?
          if [ "$profile_baseline_start_status" = "0" ]; then
            ensure_frontend
            profile_baseline_frontend_status=$?
          else
            profile_baseline_frontend_status=1
          fi
          if [ "$profile_baseline_start_status" = "0" ] \
            && [ "$profile_baseline_frontend_status" = "0" ]; then
            run_trial instrumented \
              /evidence/connection-trial-profile-baseline.json \
              /evidence/performance/issue894-profile-baseline-trace.jsonl
            profile_baseline_execution_status=$?
          else
            profile_baseline_execution_status=1
          fi
          docker logs --tail=700 backend \
            > "$evidence/connection-trial-profile-baseline-backend.txt" 2>&1 || true

          start_backend profiled
          profiled_start_status=$?
          if [ "$profiled_start_status" = "0" ]; then
            ensure_frontend
            profiled_frontend_status=$?
          else
            profiled_frontend_status=1
          fi
          if [ "$profiled_start_status" = "0" ] \
            && [ "$profiled_frontend_status" = "0" ]; then
            run_trial profiled \
              /evidence/connection-trial-profiled.json \
              /evidence/performance/issue894-profiled-trace.jsonl
            profiled_execution_status=$?
          else
            profiled_execution_status=1
          fi
          docker logs --tail=700 backend \
            > "$evidence/connection-trial-profiled-backend.txt" 2>&1 || true

          if [ "$profile_baseline_execution_status" = "0" ] \
            && [ "$profiled_execution_status" = "0" ]; then
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/workspace:ro" \
              -v "$evidence:/evidence" \
              -w /workspace \
              -e PYTHONPATH=/app:/workspace \
              resourceplanner-894-feature-backend \
              python tools/issue_894_connection_trial.py compare-profiled \
                --instrumented /evidence/connection-trial-profile-baseline.json \
                --profiled /evidence/connection-trial-profiled.json \
                --output /evidence/connection-trial-profile-comparison.json
            profile_comparison_status=$?
          else
            profile_comparison_status=1
          fi

          start_backend external-profile-preflight
          native_preflight_backend_status=$?
          native_preflight_attach_status=1
          native_preflight_status=1
          if [ "$native_preflight_backend_status" = "0" ]; then
            backend_pid="$(docker inspect --format '{{.State.Pid}}' backend)"
            native_preflight_start_ns="$(date +%s%N)"
            sudo "$pyspy" record \
              --pid "$backend_pid" \
              --native \
              --idle \
              --rate 100 \
              --duration 2 \
              --format speedscope \
              -o "$evidence/native-profile-preflight.speedscope.json"
            native_preflight_attach_status=$?
            native_preflight_end_ns="$(date +%s%N)"
            if [ -f "$evidence/native-profile-preflight.speedscope.json" ]; then
              docker run --rm \
                -v "$GITHUB_WORKSPACE:/workspace:ro" \
                -v "$evidence:/evidence" \
                -w /workspace \
                -e PYTHONPATH=/app:/workspace \
                resourceplanner-894-feature-backend \
                python tools/issue_894_native_profile.py preflight \
                  --profile /evidence/native-profile-preflight.speedscope.json \
                  --output /evidence/native-profile-preflight.json \
                  --observer-version "$pyspy_version" \
                  --attach-status "$native_preflight_attach_status" \
                  --command-start-ns "$native_preflight_start_ns" \
                  --command-end-ns "$native_preflight_end_ns" \
                  --native-requested \
                  --idle-requested
              native_preflight_status=$?
            fi
          fi

          native_baseline_execution_status=1
          native_profiled_execution_status=1
          native_observer_status=1
          native_summary_status=1
          native_comparison_status=1
          if [ "$native_preflight_status" = "0" ]; then
            start_backend external-profile-baseline
            native_baseline_start_status=$?
            if [ "$native_baseline_start_status" = "0" ]; then
              ensure_frontend
              native_baseline_frontend_status=$?
            else
              native_baseline_frontend_status=1
            fi
            if [ "$native_baseline_start_status" = "0" ] \
              && [ "$native_baseline_frontend_status" = "0" ]; then
              run_trial instrumented \
                /evidence/connection-trial-native-baseline.json \
                /evidence/performance/issue894-native-baseline-trace.jsonl
              native_baseline_execution_status=$?
            fi

            start_backend external-profiled
            native_profiled_start_status=$?
            if [ "$native_profiled_start_status" = "0" ]; then
              ensure_frontend
              native_profiled_frontend_status=$?
            else
              native_profiled_frontend_status=1
            fi
            if [ "$native_profiled_start_status" = "0" ] \
              && [ "$native_profiled_frontend_status" = "0" ]; then
              backend_pid="$(docker inspect --format '{{.State.Pid}}' backend)"
              native_profile_start_ns="$(date +%s%N)"
              sudo "$pyspy" record \
                --pid "$backend_pid" \
                --native \
                --idle \
                --rate 100 \
                --duration 35 \
                --format speedscope \
                -o "$evidence/native-profile.speedscope.json" &
              native_observer_pid=$!
              sleep 1
              run_trial instrumented \
                /evidence/connection-trial-native-profiled.json \
                /evidence/performance/issue894-native-profiled-trace.jsonl
              native_profiled_execution_status=$?
              wait "$native_observer_pid"
              native_observer_status=$?
              native_profile_end_ns="$(date +%s%N)"
            fi

            if [ "$native_profiled_execution_status" = "0" ] \
              && [ "$native_observer_status" = "0" ] \
              && [ -f "$evidence/native-profile.speedscope.json" ]; then
              docker run --rm \
                -v "$GITHUB_WORKSPACE:/workspace:ro" \
                -v "$evidence:/evidence" \
                -w /workspace \
                -e PYTHONPATH=/app:/workspace \
                resourceplanner-894-feature-backend \
                python tools/issue_894_native_profile.py summarize \
                  --profile /evidence/native-profile.speedscope.json \
                  --preflight /evidence/native-profile-preflight.json \
                  --trace /evidence/performance/issue894-native-profiled-trace.jsonl \
                  --command-start-ns "$native_profile_start_ns" \
                  --command-end-ns "$native_profile_end_ns" \
                  --output /evidence/native-profile-summary.json
              native_summary_status=$?
            fi

            if [ "$native_baseline_execution_status" = "0" ] \
              && [ "$native_profiled_execution_status" = "0" ]; then
              docker run --rm \
                -v "$GITHUB_WORKSPACE:/workspace:ro" \
                -v "$evidence:/evidence" \
                -w /workspace \
                -e PYTHONPATH=/app:/workspace \
                resourceplanner-894-feature-backend \
                python tools/issue_894_native_profile.py compare \
                  --baseline /evidence/connection-trial-native-baseline.json \
                  --profiled /evidence/connection-trial-native-profiled.json \
                  --output /evidence/native-profile-comparison.json
              native_comparison_status=$?
            fi
          fi

          set -e

          {
            printf 'label=DIAGNOSTIC - NOT CERTIFICATION\n'
            printf 'trial_outcome_source=connection-trial-*.json:diagnostic_acceptance_behavior_failed\n'
            printf 'canonical_execution_status=%s\n' "$canonical_execution_status"
            printf 'instrumented_execution_status=%s\n' "$instrumented_execution_status"
            printf 'xe_preclean_status=%s\n' "$xe_preclean_status"
            printf 'xe_start_status=%s\n' "$xe_start_status"
            printf 'xe_stop_status=%s\n' "$xe_stop_status"
            printf 'xe_file_cleanup_status=%s\n' "$xe_file_cleanup_status"
            printf 'xe_finalize_cleanup_status=%s\n' "$xe_finalize_cleanup_status"
            printf 'correlation_status=%s\n' "$correlation_status"
            printf 'comparison_execution_status=%s\n' "$comparison_execution_status"
            printf 'profile_baseline_execution_status=%s\n' "$profile_baseline_execution_status"
            printf 'profiled_execution_status=%s\n' "$profiled_execution_status"
            printf 'profile_comparison_status=%s\n' "$profile_comparison_status"
            printf 'native_preflight_attach_status=%s\n' "$native_preflight_attach_status"
            printf 'native_preflight_status=%s\n' "$native_preflight_status"
            printf 'native_baseline_execution_status=%s\n' "$native_baseline_execution_status"
            printf 'native_profiled_execution_status=%s\n' "$native_profiled_execution_status"
            printf 'native_observer_status=%s\n' "$native_observer_status"
            printf 'native_summary_status=%s\n' "$native_summary_status"
            printf 'native_comparison_status=%s\n' "$native_comparison_status"
            printf 'full_mixed_load=NOT RUN\n'
            printf 'ack_campaign=NOT RUN\n'
            printf 'v2_campaign=NOT RUN\n'
            printf 'rollback_campaign=NOT RUN\n'
          } > "$evidence/connection-trial-status.txt"

          test "$canonical_execution_status" = "0"
          test "$instrumented_execution_status" = "0"
          test "$comparison_execution_status" = "0"
          test "$profile_baseline_execution_status" = "0"
          test "$profiled_execution_status" = "0"
          test "$profile_comparison_status" = "0"
          test "$native_preflight_attach_status" = "0"
          test "$native_preflight_status" = "0"
          test "$native_baseline_execution_status" = "0"
          test "$native_profiled_execution_status" = "0"
          test "$native_observer_status" = "0"
          test "$native_summary_status" = "0"
          test "$native_comparison_status" = "0"

      - name: Run existing V2 API performance budget
        id: benchmark
        if: ${{ false }}
        continue-on-error: true
        shell: bash
        run: |
          docker run --rm             -v "$GITHUB_WORKSPACE:/workspace:ro"             -v "$GITHUB_WORKSPACE/phase4-evidence:/evidence"             -w /workspace             -e PYTHONPATH=/app:/workspace             resourceplanner-894-feature-backend             python tools/benchmark_v2_api.py               --iterations 3               --ci               --output /evidence/v2-api-benchmark.json

      - name: Build and test schema-compatible rollback bundle
        id: rollback
        if: ${{ false }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/phase4-evidence"
          rollback_dir="$evidence/rollback"
          mkdir -p "$rollback_dir"

          sh tools/build_issue_894_rollback_bundle.sh             --prev-sha "$RP894_BASE_SHA"             --feature-sha "$RP894_HEAD_SHA"             --output-dir "$rollback_dir"

          tag="$(cat "$rollback_dir/issue-894-rollback-tag.txt")"
          rollback_backend="resourceplanner-backend:$tag"
          rollback_frontend="resourceplanner-frontend:$tag"

          docker stop --time 30 frontend backend >/dev/null 2>&1 || true
          docker rm -f frontend backend >/dev/null 2>&1 || true

          docker run -d             --name backend             --network "$RP894_NETWORK"             -e RESOURCEPLANNER_DATABASE_URL="$RP894_DATABASE_URL"             -e RESOURCEPLANNER_HOST=0.0.0.0             -e RESOURCEPLANNER_PORT=8000             -e RESOURCEPLANNER_LOG_LEVEL=info             -e RESOURCEPLANNER_AUTH_MODE=oidc             -e RESOURCEPLANNER_OIDC_DISCOVERY_URL=https://identity.example.invalid/.well-known/openid-configuration             -e RESOURCEPLANNER_OIDC_CLIENT_ID=issue-894-rollback             -e RESOURCEPLANNER_OIDC_REDIRECT_URI=http://frontend:8080/api/v1/auth/callback             -e RESOURCEPLANNER_OIDC_SECURE_COOKIE=false             -e RESOURCEPLANNER_API_DOCS_ENABLED=false             -e RESOURCEPLANNER_ERP_SYNC_ENABLED=false             "$rollback_backend" >/dev/null

          for attempt in $(seq 1 60); do
            if docker run --rm --network "$RP894_NETWORK"               "$rollback_backend"               python -c "from urllib.request import urlopen; r=urlopen('http://backend:8000/ready', timeout=3); raise SystemExit(0 if r.status == 200 else 1)"               >/dev/null 2>&1; then
              break
            fi
            test "$attempt" != "60"
            sleep 2
          done

          docker run -d             --name frontend             --network "$RP894_NETWORK"             -e RESOURCEPLANNER_ENVIRONMENT=PROD             "$rollback_frontend" >/dev/null

          for attempt in $(seq 1 60); do
            if docker run --rm --network "$RP894_NETWORK"               "$rollback_backend"               python -c "from urllib.request import urlopen; r=urlopen('http://frontend:8080/ready', timeout=3); raise SystemExit(0 if r.status == 200 else 1)"               >/dev/null 2>&1; then
              break
            fi
            test "$attempt" != "60"
            sleep 2
          done

          docker run --rm             --network "$RP894_NETWORK"             -v "$GITHUB_WORKSPACE:/workspace:ro"             -v "$RP894_SECRETS_DIR:/secrets:ro"             -v "$evidence:/evidence"             -w /workspace             -e PYTHONPATH=/app:/workspace             resourceplanner-894-feature-backend             python tools/issue_894_phase4_load.py rollback-smoke               --credentials /secrets/sessions.json               --output /evidence/rollback-smoke.json

          {
            docker inspect backend --format 'backend image={{.Config.Image}} image_id={{.Image}} status={{.State.Status}}'
            docker inspect frontend --format 'frontend image={{.Config.Image}} image_id={{.Image}} status={{.State.Status}}'
            docker image inspect "$rollback_backend" --format 'backend_revision={{ index .Config.Labels "org.opencontainers.image.revision" }}'
            docker image inspect "$rollback_frontend" --format 'frontend_revision={{ index .Config.Labels "org.opencontainers.image.revision" }}'
          } > "$evidence/rollback-runtime-provenance.txt"

      - name: Upload Phase 4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-894-phase4-evidence-${{ github.event.pull_request.head.sha }}
          path: phase4-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Clean disposable Phase 4 runtime
        if: always()
        shell: bash
        run: |
          docker rm -f frontend backend >/dev/null 2>&1 || true
          if [ -n "${RP894_DATABASE_URL:-}" ] \
            && [ -n "${RP894_NETWORK:-}" ]; then
            docker run --rm \
              --network "$RP894_NETWORK" \
              -v "$GITHUB_WORKSPACE:/workspace:ro" \
              -w /workspace \
              -e PYTHONPATH=/app:/workspace \
              resourceplanner-894-feature-backend \
              python tools/issue_894_connection_trial.py xe-cleanup \
                --database-url "$RP894_DATABASE_URL" \
              >/dev/null 2>&1 || true
          fi
          if [ -n "${RP894_SQL_SERVER:-}" ]; then
            docker exec "$RP894_SQL_SERVER" sh -c \
              'rm -f /var/opt/mssql/log/rp894_short_correlation*.xel' \
              >/dev/null 2>&1 || true
            docker rm -f "$RP894_SQL_SERVER" >/dev/null 2>&1 || true
          fi
          if [ -n "${RP894_NETWORK:-}" ]; then
            docker network rm "$RP894_NETWORK" >/dev/null 2>&1 || true
          fi
          if [ -n "${RP894_SECRETS_DIR:-}" ]; then
            rm -rf "$RP894_SECRETS_DIR"
          fi

      - name: Enforce Phase 4 evidence gates
        if: always()
        shell: bash
        run: |
          test "${{ steps.load.outcome }}" = "success"
