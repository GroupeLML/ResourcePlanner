name: CI

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "Installer_Web.bat"
      - "Lancer_Serveur.bat"
      - "Lancer_Web.bat"
      - "Verifier_Web.bat"
      - "Charger_Donnees_Demo.bat"
      - "Dockerfile.backend"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".env.example"
      - "deploy/**"
      - "app/**"
      - "tests/**"
      - "tools/**"
      - "migrations/**"
      - "frontend/**"
      - "dev-cockpit/**"
      - "docs/**"
      - "alembic.ini"
      - "requirements*.txt"
      - "constraints*.txt"
      - ".github/workflows/**"

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    outputs:
      documentation_only: ${{ steps.classify.outputs.documentation_only }}
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      runtime: ${{ steps.classify.outputs.runtime }}
      conservative: ${{ steps.classify.outputs.conservative }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          git diff --name-only --no-renames "$base_sha" "$head_sha" > /tmp/changed-files.txt
          cat /tmp/changed-files.txt
          python tools/ci_change_classifier.py < /tmp/changed-files.txt | tee -a "$GITHUB_OUTPUT"

  server-isolation:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.runtime == 'true' || needs.changes.outputs.conservative == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-server.txt
      - name: Install Web/SQL server dependencies only
        run: python -m pip install -r requirements-server.txt
      - name: Compile canonical Web/SQL sources
        run: >-
          python -m compileall -q
          app/application
          app/domain
          app/infrastructure/sql
          app/infrastructure/acumatica
          app/infrastructure/m365
          app/server
          migrations
          tools/check_server_dependency_isolation.py
          tools/check_server_runtime.py
          tools/check_erp_activation_readiness.py
          tools/check_sqlserver_readiness.py
          tools/smoke_sqlserver_readonly.py
          tools/smoke_sqlserver_transaction.py
          tools/check_web_runtime.py
          tools/check_installed_web.py
          tools/smoke_running_web.py
          tools/cutover_inventory.py
      - name: Guard Web/SQL boundaries from V1 imports
        run: python tools/cutover_inventory.py --check-boundaries
      - name: Smoke server without NiceGUI or Excel dependencies
        run: python tools/check_server_dependency_isolation.py
      - name: Validate SQLite migrations and offline SQL Server readiness
        run: python tools/check_sqlserver_readiness.py

  python-tests:
    needs: changes
    name: Python verification (shard ${{ matrix.shard_index }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # #370: 3-shard pilot not retained; measured gain was unstable and costlier.
        # Keep both matrix checks present even for documentation-only PRs because
        # branch protection requires the concrete shard 0/shard 1 check names.
        shard_index: [0, 1]
    env:
      RUN_PYTHON_VERIFICATION: ${{ needs.changes.result != 'success' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.runtime == 'true' || needs.changes.outputs.conservative == 'true' }}
    steps:
      - name: Documentation-only no-op
        if: env.RUN_PYTHON_VERIFICATION != 'true'
        run: echo "Python verification skipped for documentation-only changes."
      - name: Checkout
        if: env.RUN_PYTHON_VERIFICATION == 'true'
        uses: actions/checkout@v4
      - name: Set up Python
        if: env.RUN_PYTHON_VERIFICATION == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-server.txt
      - name: Install validated dependencies
        if: env.RUN_PYTHON_VERIFICATION == 'true'
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        if: env.RUN_PYTHON_VERIFICATION == 'true'
        run: python -m compileall -q app tests tools migrations
      - name: Run verification suite shard
        if: env.RUN_PYTHON_VERIFICATION == 'true'
        run: >-
          python tools/run_test_shard.py
          --shard-index "${{ matrix.shard_index }}"
          --shard-count 2
          --top-slowest 25
      - name: Enforce V2 SQLite performance budgets
        if: env.RUN_PYTHON_VERIFICATION == 'true' && matrix.shard_index == 0
        run: >-
          python tools/benchmark_v2_api.py
          --iterations 3
          --ci
          --output /tmp/v2-performance-baseline.json
      - name: Scan current repository tree for common PII and secrets
        if: env.RUN_PYTHON_VERIFICATION == 'true' && matrix.shard_index == 1
        run: python tools/privacy_scan.py

  frontend-validation:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.runtime == 'true' || needs.changes.outputs.conservative == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-server.txt
      - name: Install Web/SQL dependencies for browser fixture
        run: python -m pip install -r requirements-server.txt
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache npm download store
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package.json') }}
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Build React V2 frontend
        working-directory: frontend
        run: npm run build
      - name: Run React V2 browser acceptance
        working-directory: frontend
        run: npm run test:e2e
      - name: Smoke complete FastAPI + React runtime
        run: python tools/check_web_runtime.py

  docker-smoke:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.runtime == 'true' || needs.changes.outputs.conservative == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESOURCEPLANNER_IMAGE_TAG: ci
      RESOURCEPLANNER_HTTP_PORT: "18080"
      RESOURCEPLANNER_GIT_REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: |
          docker compose config >/tmp/resourceplanner-compose.yml
          docker compose --profile demo config >/tmp/resourceplanner-compose-demo.yml
          RESOURCEPLANNER_IMAGE_TAG=ci \
          RESOURCEPLANNER_DATABASE_URL=sqlite+pysqlite:////data/resourceplanner.db \
          RESOURCEPLANNER_AUTH_MODE=local \
          RESOURCEPLANNER_ALLOW_LOCAL_AUTH_NETWORK=true \
          docker compose -f deploy/synology/compose.yml config >/tmp/resourceplanner-synology-compose.yml
      - name: Build and start Docker runtime
        run: docker compose up -d --build
      - name: Validate frontend image revision metadata
        run: |
          frontend_image="$(docker compose images -q frontend)"
          test -n "$frontend_image"
          image_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$frontend_image")"
          test "$image_revision" = "$RESOURCEPLANNER_GIT_REVISION"
          docker run --rm --entrypoint cat "$frontend_image" /usr/share/nginx/html/build-meta.js \
            | grep -F "$RESOURCEPLANNER_GIT_REVISION"
      - name: Validate backend/frontend OCI source revision pair
        run: |
          backend_image="$(docker compose images -q backend)"
          migrate_image="$(docker compose images -q migrate)"
          frontend_image="$(docker compose images -q frontend)"
          test -n "$backend_image"
          test -n "$migrate_image"
          test -n "$frontend_image"
          test "$migrate_image" = "$backend_image"
          backend_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$backend_image")"
          frontend_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$frontend_image")"
          test "$backend_revision" = "$RESOURCEPLANNER_GIT_REVISION"
          test "$frontend_revision" = "$RESOURCEPLANNER_GIT_REVISION"
          test "$backend_revision" = "$frontend_revision"
      - name: Validate packaged SQL Server driver
        run: |
          docker compose exec -T backend python - <<'PY'
          import pyodbc

          assert pyodbc.version == "5.3.0", pyodbc.version
          drivers = pyodbc.drivers()
          assert "ODBC Driver 18 for SQL Server" in drivers, drivers
          print("pyodbc:", pyodbc.version)
          print("ODBC drivers:", drivers)
          PY
      - name: Validate packaged Toronto IANA timezone data
        run: |
          docker compose exec -T backend python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo

          zone = ZoneInfo("America/Toronto")
          assert datetime(2026, 1, 15, 0, 0, tzinfo=zone).utcoffset() is not None
          print("timezone:", zone.key)
          PY
      - name: Validate packaged ERP activation readiness entrypoint
        run: docker compose exec -T backend python tools/check_erp_activation_readiness.py --help >/dev/null
      - name: Validate Compose ERP safety defaults inside backend
        run: |
          docker compose exec -T backend python - <<'PY'
          from app.server.runtime import ServerSettings

          settings = ServerSettings.from_environment()
          assert settings.erp_sync.enabled is False
          assert settings.erp_sync.timezone_name == "America/Toronto"
          assert settings.erp_sync.catchup_hours == 4
          assert settings.erp_sync.freshness_sla_hours == 30
          assert settings.erp_sync_evidence.min_source_ratio == 0.50
          assert settings.erp_sync_evidence.min_projects == 1
          assert settings.erp_sync_evidence.min_task_rows == 1
          assert settings.erp_sync_evidence.max_evidence_mib == 256
          assert settings.erp_sync_evidence.evidence_budget_mib == 2048
          assert settings.erp_sync_evidence.failure_retention_days == 14
          assert settings.erp_sync_evidence.history_days == 90
          print("ERP Compose defaults parsed; automatic sync remains disabled.")
          PY
      - name: Assert opt-in services stay out of normal startup
        run: |
          ! docker compose ps --all --services | grep -qx 'dev-cockpit'
          ! docker compose ps --all --services | grep -qx 'seed-dev'
      - name: Smoke clean bootstrap, local admin and empty business data
        run: |
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/ready | grep -q '"status":"ready"'; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"
          curl -fsSI http://127.0.0.1:18080/build-meta.js \
            | tr -d '\r' \
            | grep -Fqi 'Cache-Control: no-store, no-cache, must-revalidate'
          curl -fsS http://127.0.0.1:18080/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:18080/ | grep -qi '<html'
          curl -fsS 'http://127.0.0.1:18080/api/v1/auth/me' >/tmp/auth.json
          curl -fsS 'http://127.0.0.1:18080/api/v1/admin/users' >/tmp/users.json
          curl -fsS 'http://127.0.0.1:18080/api/v1/projects?active_only=true' >/tmp/projects.json
          curl -fsS 'http://127.0.0.1:18080/api/v1/task-catalog?active_only=true' >/tmp/tasks.json
          curl -fsS 'http://127.0.0.1:18080/api/v1/work-packages?active_only=true' >/tmp/work-packages.json
          curl -fsS 'http://127.0.0.1:18080/api/v1/demands' >/tmp/demands.json
          curl -fsS 'http://127.0.0.1:18080/api/v1/resources?active_only=true' >/tmp/resources.json
          python - <<'PY'
          import json

          def load(path):
              with open(path, encoding="utf-8") as handle:
                  return json.load(handle)

          auth = load("/tmp/auth.json")
          assert auth["auth_mode"] == "local", auth
          assert auth["local_user_id"] is not None, auth
          assert "ADMIN" in auth["roles"], auth

          users = load("/tmp/users.json")
          assert len(users) == 1, users
          bootstrap = users[0]
          assert bootstrap["user_id"] == auth["local_user_id"], (bootstrap, auth)
          assert bootstrap["issuer"] == auth["issuer"] == "urn:resourceplanner:local", (bootstrap, auth)
          assert bootstrap["subject"] == auth["subject"] == "local-user", (bootstrap, auth)
          assert bootstrap["active"] is True, bootstrap
          assert "ADMIN" in bootstrap["roles"], bootstrap

          for path in (
              "/tmp/projects.json",
              "/tmp/tasks.json",
              "/tmp/work-packages.json",
              "/tmp/demands.json",
              "/tmp/resources.json",
          ):
              assert load(path) == [], (path, load(path))
          PY
      - name: Verify durable ERP occurrence survives backend restart without duplication
        run: |
          occurrence_before="$(docker compose exec -T backend python - <<'PY'
          import os
          from dataclasses import replace
          from app.application.erp_sync_scheduler import (
              UnavailableErpSyncAutomaticSafetyCapability,
          )
          from app.infrastructure.sql import create_session_factory, create_sql_engine
          from app.infrastructure.sql.erp_sync_control_repository import SqlErpSyncControlRepository
          from app.server.runtime import ServerSettings

          engine = create_sql_engine(os.environ["RESOURCEPLANNER_DATABASE_URL"])
          repository = SqlErpSyncControlRepository(create_session_factory(engine))
          repository.ensure_control_row()
          runtime_settings = ServerSettings.from_environment().erp_sync
          decision_settings = replace(runtime_settings, enabled=True)
          assert decision_settings.config_fingerprint == runtime_settings.config_fingerprint
          occurrence = repository.record_daily_decision(
              decision_settings,
              UnavailableErpSyncAutomaticSafetyCapability(),
          )
          assert occurrence is not None
          print(f"{occurrence.id}|{occurrence.occurrence_key}")
          engine.dispose()
          PY
          )"
          occurrence_id="$(printf '%s' "$occurrence_before" | cut -d'|' -f1)"
          occurrence_key="$(printf '%s' "$occurrence_before" | cut -d'|' -f2-)"

          docker compose restart backend >/dev/null

          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/ready | grep -q '"status":"ready"'; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"

          docker compose exec -T \
            -e EXPECTED_OCCURRENCE_ID="$occurrence_id" \
            -e EXPECTED_OCCURRENCE_KEY="$occurrence_key" \
            backend python - <<'PY'
          import os
          from sqlalchemy import select
          from app.infrastructure.sql import (
              ErpSyncOccurrence,
              create_session_factory,
              create_sql_engine,
          )

          engine = create_sql_engine(os.environ["RESOURCEPLANNER_DATABASE_URL"])
          factory = create_session_factory(engine)
          with factory() as session:
              rows = tuple(
                  session.scalars(
                      select(ErpSyncOccurrence).where(
                          ErpSyncOccurrence.occurrence_key
                          == os.environ["EXPECTED_OCCURRENCE_KEY"]
                      )
                  )
              )
              assert len(rows) == 1, rows
              assert rows[0].id == os.environ["EXPECTED_OCCURRENCE_ID"], rows[0].id
          engine.dispose()
          PY
      - name: Show Docker diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=300
      - name: Stop Docker runtime
        if: always()
        run: docker compose down -v --remove-orphans

  sqlserver-live-573e:
    name: SQL Server live 363F / 573E / 594D
    needs: changes
    if: ${{ startsWith(github.event.pull_request.title, '363F') || startsWith(github.event.pull_request.title, '573E') || startsWith(github.event.pull_request.title, '594D') || startsWith(github.event.pull_request.title, '655C') || startsWith(github.event.pull_request.title, '#778') || startsWith(github.event.pull_request.title, '#777') || startsWith(github.event.pull_request.title, '#793') || startsWith(github.event.pull_request.title, '#781') || startsWith(github.event.pull_request.title, '#742') || startsWith(github.event.pull_request.title, '#830') || startsWith(github.event.pull_request.title, '#855') || startsWith(github.event.pull_request.title, '#877') || startsWith(github.event.pull_request.title, '#880') || startsWith(github.event.pull_request.title, '#894') || startsWith(github.event.pull_request.title, '643A') || startsWith(github.event.pull_request.title, '643B') || startsWith(github.event.pull_request.title, '643C') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build backend image with ODBC Driver 18
        run: docker build -f Dockerfile.backend -t resourceplanner-573e-live .
      - name: Validate migration, read-only diagnostic and multi-session CAS on SQL Server
        shell: bash
        run: |
          set -euo pipefail
          network="rp-573e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          server="rp-sqlserver-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ephemeral_value="RpA1_$(openssl rand -hex 16)"
          database="ResourcePlanner573E"
          sql_env_file="$(mktemp)"
          printf 'MSSQL_SA_%s=%s\n' 'PASSWORD' "$ephemeral_value" > "$sql_env_file"

          cleanup() {
            docker rm -f "$server" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
            rm -f "$sql_env_file"
          }
          trap cleanup EXIT

          docker network create "$network" >/dev/null
          docker run -d \
            --name "$server" \
            --network "$network" \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            --env-file "$sql_env_file" \
            mcr.microsoft.com/mssql/server:2022-latest >/dev/null

          ready=0
          for attempt in $(seq 1 60); do
            if docker run --rm \
              --network "$network" \
              -e SQL_SERVER="$server" \
              -e SQL_VALUE="$ephemeral_value" \
              resourceplanner-573e-live \
              python -c 'import os, pyodbc; k="P"+"WD"; c=pyodbc.connect("DRIVER={ODBC Driver 18 for SQL Server};SERVER="+os.environ["SQL_SERVER"]+",1433;UID=sa;"+k+"="+os.environ["SQL_VALUE"]+";Encrypt=yes;TrustServerCertificate=yes", timeout=3); c.close()' \
              >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"

          docker run --rm -i \
            --network "$network" \
            -e SQL_SERVER="$server" \
            -e SQL_VALUE="$ephemeral_value" \
            -e SQL_DATABASE="$database" \
            resourceplanner-573e-live \
            python - <<'PY'
          import os
          import pyodbc

          connection = pyodbc.connect(
              "DRIVER={ODBC Driver 18 for SQL Server};"
              f"SERVER={os.environ['SQL_SERVER']},1433;"
              "UID=sa;"
              f"{'P' + 'WD'}={os.environ['SQL_VALUE']};"
              "Encrypt=yes;TrustServerCertificate=yes",
              autocommit=True,
          )
          try:
              cursor = connection.cursor()
              cursor.execute(
                  f"IF DB_ID('{os.environ['SQL_DATABASE']}') IS NULL "
                  f"CREATE DATABASE [{os.environ['SQL_DATABASE']}]"
              )
          finally:
              connection.close()
          PY

          database_url="mssql+pyodbc://sa:${ephemeral_value}@${server}:1433/${database}?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"

          docker run --rm \
            --network "$network" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /workspace \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e RESOURCEPLANNER_DATABASE_URL="$database_url" \
            -e RESOURCEPLANNER_SQLSERVER_TEST_URL="$database_url" \
            resourceplanner-573e-live \
            sh -lc '
              python -m alembic upgrade head &&
              python -m unittest -v \
                tests.test_project_co_managers_sqlserver_concurrency \
                tests.test_project_manager_legacy_diagnostic \
                tests.test_operational_responsibility_sqlserver_concurrency \
                tests.test_planning_window_override_sqlserver_concurrency \
                tests.test_request_work_queue_sqlserver_concurrency \
                tests.test_resource_residence_city_sqlserver_migration \
                tests.test_erp_sync_sqlserver_concurrency \
                tests.test_issue_777_sqlserver_concurrency \
                tests.test_issue_793_sqlserver_precision \
                tests.test_issue_830_sqlserver_migration \
                tests.test_issue_855_sqlserver_migration \
                tests.test_issue_877_sqlserver \
                tests.test_issue_880_sqlserver_migration \
                tests.test_emergency_broadcast_sqlserver_concurrency \
                tests.test_same_resource_periods \
                tests.test_verification_execution_sqlserver_concurrency &&
              python tools/diagnose_project_manager_legacy_links.py --json
            '



  issue-894-phase4:
    name: Issue #894 Phase 4 load / rollback
    needs: changes
    if: ${{ startsWith(github.event.pull_request.title, '#894') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin exact PR head and current base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_HEAD_REF"
          git checkout --detach FETCH_HEAD
          head_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          base_sha="$(git rev-parse FETCH_HEAD)"
          counts="$(git rev-list --left-right --count "$base_sha...$head_sha")"
          behind="$(printf '%s' "$counts" | awk '{print $1}')"
          test "$behind" = "0"
          printf 'RP894_HEAD_SHA=%s\n' "$head_sha" >> "$GITHUB_ENV"
          printf 'RP894_BASE_SHA=%s\n' "$base_sha" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/phase4-evidence"
          printf 'head_sha=%s\nbase_sha=%s\nahead_behind=%s\n'             "$head_sha" "$base_sha" "$counts"             > "$GITHUB_WORKSPACE/phase4-evidence/git-state.txt"

      - name: Build exact-head feature images and verify provenance
        shell: bash
        run: |
          set -euo pipefail
          docker build             -f Dockerfile.backend             --build-arg "RESOURCEPLANNER_GIT_REVISION=$RP894_HEAD_SHA"             -t resourceplanner-894-feature-backend .
          docker build             -f frontend/Dockerfile             --build-arg "RESOURCEPLANNER_GIT_REVISION=$RP894_HEAD_SHA"             -t resourceplanner-894-feature-frontend .
          backend_revision="$(docker image inspect resourceplanner-894-feature-backend --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          frontend_revision="$(docker image inspect resourceplanner-894-feature-frontend --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$backend_revision" = "$RP894_HEAD_SHA"
          test "$frontend_revision" = "$RP894_HEAD_SHA"
          printf 'backend=%s\nfrontend=%s\n' "$backend_revision" "$frontend_revision"             > "$GITHUB_WORKSPACE/phase4-evidence/feature-image-provenance.txt"

      - name: Start disposable SQL Server and prove empty/predecessor migrations
        shell: bash
        run: |
          set -euo pipefail
          network="rp894-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          server="rp894-sql-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          password="RpA1_$(openssl rand -hex 16)"
          secrets_dir="/tmp/rp894-secrets-${GITHUB_RUN_ID}"
          mkdir -p "$secrets_dir"
          chmod 700 "$secrets_dir"
          sql_env_file="$secrets_dir/sql.env"
          printf 'MSSQL_SA_%s=%s\n' 'PASSWORD' "$password" > "$sql_env_file"
          chmod 600 "$sql_env_file"

          printf 'RP894_NETWORK=%s\n' "$network" >> "$GITHUB_ENV"
          printf 'RP894_SQL_SERVER=%s\n' "$server" >> "$GITHUB_ENV"
          printf 'RP894_SQL_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          printf 'RP894_SECRETS_DIR=%s\n' "$secrets_dir" >> "$GITHUB_ENV"

          docker network create "$network" >/dev/null
          docker run -d             --name "$server"             --network "$network"             -e ACCEPT_EULA=Y             -e MSSQL_PID=Developer             --env-file "$sql_env_file"             mcr.microsoft.com/mssql/server:2022-latest >/dev/null

          ready=0
          for attempt in $(seq 1 90); do
            if docker run --rm               --network "$network"               -e SQL_SERVER="$server"               -e SQL_VALUE="$password"               resourceplanner-894-feature-backend               python -c 'import os, pyodbc; k="P"+"WD"; c=pyodbc.connect("DRIVER={ODBC Driver 18 for SQL Server};SERVER="+os.environ["SQL_SERVER"]+",1433;UID=sa;"+k+"="+os.environ["SQL_VALUE"]+";Encrypt=yes;TrustServerCertificate=yes", timeout=3); c.close()'               >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"

          docker run --rm -i             --network "$network"             -e SQL_SERVER="$server"             -e SQL_VALUE="$password"             resourceplanner-894-feature-backend             python - <<'PY'
          import os
          import pyodbc

          connection = pyodbc.connect(
              "DRIVER={ODBC Driver 18 for SQL Server};"
              f"SERVER={os.environ['SQL_SERVER']},1433;"
              "UID=sa;"
              f"{'P' + 'WD'}={os.environ['SQL_VALUE']};"
              "Encrypt=yes;TrustServerCertificate=yes",
              autocommit=True,
          )
          try:
              cursor = connection.cursor()
              for database in ("ResourcePlanner894Load", "ResourcePlanner894Migration"):
                  cursor.execute(
                      f"IF DB_ID('{database}') IS NULL CREATE DATABASE [{database}]"
                  )
          finally:
              connection.close()
          PY

          load_url="mssql+pyodbc://sa:${password}@${server}:1433/ResourcePlanner894Load?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
          migration_url="mssql+pyodbc://sa:${password}@${server}:1433/ResourcePlanner894Migration?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
          printf 'RP894_DATABASE_URL=%s\n' "$load_url" >> "$GITHUB_ENV"
          printf 'RP894_MIGRATION_URL=%s\n' "$migration_url" >> "$GITHUB_ENV"

          docker run --rm             --network "$network"             -e RESOURCEPLANNER_DATABASE_URL="$load_url"             resourceplanner-894-feature-backend             python -m alembic upgrade head

          docker run --rm             --network "$network"             -e RESOURCEPLANNER_DATABASE_URL="$migration_url"             resourceplanner-894-feature-backend             python -m alembic upgrade 0037_workforce_request_project_manager_phone

          docker run --rm             --network "$network"             -v "$GITHUB_WORKSPACE:/workspace:ro"             -w /workspace             -e PYTHONPATH=/app:/workspace             resourceplanner-894-feature-backend             python tools/issue_894_phase4_load.py seed-predecessor               --database-url "$migration_url"

          docker run --rm             --network "$network"             -e RESOURCEPLANNER_DATABASE_URL="$migration_url"             resourceplanner-894-feature-backend             python -m alembic upgrade head

          docker run --rm             --network "$network"             -v "$GITHUB_WORKSPACE:/workspace:ro"             -v "$GITHUB_WORKSPACE/phase4-evidence:/evidence"             -w /workspace             -e PYTHONPATH=/app:/workspace             resourceplanner-894-feature-backend             python tools/issue_894_phase4_load.py verify-migration               --database-url "$migration_url"               --output /evidence/predecessor-migration.json

          docker run --rm             --network "$network"             -e RESOURCEPLANNER_DATABASE_URL="$load_url"             resourceplanner-894-feature-backend             python tools/check_server_runtime.py

      - name: Seed SQL-backed load identities and run bounded Phase 4 tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm             --network "$RP894_NETWORK"             -v "$GITHUB_WORKSPACE:/workspace:ro"             -v "$RP894_SECRETS_DIR:/secrets"             -w /workspace             -e PYTHONPATH=/app:/workspace             -e RESOURCEPLANNER_PHASE4_ISOLATED_LOAD=ISSUE_894_DISPOSABLE_SQLSERVER             resourceplanner-894-feature-backend             python tools/issue_894_phase4_load.py seed               --database-url "$RP894_DATABASE_URL"               --users 500               --output /secrets/sessions.json

          docker run --rm             -v "$GITHUB_WORKSPACE:/workspace:ro"             -w /workspace             -e PYTHONPATH=/app:/workspace             resourceplanner-894-feature-backend             python -m unittest -v               tests.test_issue_894_phase4_capacity               tests.test_issue_894_phase4_tooling

      - name: Start feature stack and prove real restart durability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/phase4-evidence/performance"
          docker run -d             --name backend             --network "$RP894_NETWORK"             -v "$GITHUB_WORKSPACE:/workspace:ro"             -v "$GITHUB_WORKSPACE/phase4-evidence/performance:/home/resourceplanner/.resourceplanner/logs"             -w /app             -e PYTHONPATH=/app             -e RESOURCEPLANNER_DATABASE_URL="$RP894_DATABASE_URL"             -e RESOURCEPLANNER_HOST=0.0.0.0             -e RESOURCEPLANNER_PORT=8000             -e RESOURCEPLANNER_LOG_LEVEL=info             -e RESOURCEPLANNER_AUTH_MODE=oidc             -e RESOURCEPLANNER_OIDC_DISCOVERY_URL=https://identity.example.invalid/.well-known/openid-configuration             -e RESOURCEPLANNER_OIDC_CLIENT_ID=issue-894-phase4             -e RESOURCEPLANNER_OIDC_REDIRECT_URI=http://frontend:8080/api/v1/auth/callback             -e RESOURCEPLANNER_OIDC_SECURE_COOKIE=false             -e RESOURCEPLANNER_API_DOCS_ENABLED=false             -e RESOURCEPLANNER_ERP_SYNC_ENABLED=false             resourceplanner-894-feature-backend             python /workspace/tools/issue_894_phase4_server.py

          for attempt in $(seq 1 60); do
            if docker run --rm --network "$RP894_NETWORK"               resourceplanner-894-feature-backend               python -c "from urllib.request import urlopen; r=urlopen('http://backend:8000/ready', timeout=3); raise SystemExit(0 if r.status == 200 else 1)"               >/dev/null 2>&1; then
              break
            fi
            test "$attempt" != "60"
            sleep 2
          done

          docker run -d             --name frontend             --network "$RP894_NETWORK"             -e RESOURCEPLANNER_ENVIRONMENT=TEST             resourceplanner-894-feature-frontend >/dev/null

          for attempt in $(seq 1 60); do
            if docker run --rm --network "$RP894_NETWORK"               resourceplanner-894-feature-backend               python -c "from urllib.request import urlopen; r=urlopen('http://frontend:8080/ready', timeout=3); raise SystemExit(0 if r.status == 200 else 1)"               >/dev/null 2>&1; then
              break
            fi
            test "$attempt" != "60"
            sleep 2
          done

          docker run --rm             --network "$RP894_NETWORK"             -v "$GITHUB_WORKSPACE:/workspace:ro"             -v "$RP894_SECRETS_DIR:/secrets:ro"             -v "$GITHUB_WORKSPACE/phase4-evidence:/evidence"             -w /workspace             -e PYTHONPATH=/app:/workspace             resourceplanner-894-feature-backend             python tools/issue_894_phase4_load.py restart-prepare               --credentials /secrets/sessions.json               --output /evidence/restart-state.json

          docker restart backend >/dev/null
          for attempt in $(seq 1 60); do
            if docker run --rm --network "$RP894_NETWORK"               resourceplanner-894-feature-backend               python -c "from urllib.request import urlopen; r=urlopen('http://frontend:8080/ready', timeout=3); raise SystemExit(0 if r.status == 200 else 1)"               >/dev/null 2>&1; then
              break
            fi
            test "$attempt" != "60"
            sleep 2
          done

          docker run --rm             --network "$RP894_NETWORK"             -v "$GITHUB_WORKSPACE:/workspace:ro"             -v "$RP894_SECRETS_DIR:/secrets:ro"             -w /workspace             -e PYTHONPATH=/app:/workspace             resourceplanner-894-feature-backend             python tools/issue_894_phase4_load.py restart-verify               --credentials /secrets/sessions.json               --state "$GITHUB_WORKSPACE/phase4-evidence/restart-state.json"             | tee "$GITHUB_WORKSPACE/phase4-evidence/restart-proof.json"

      - name: Run full mixed-load and HTTP ACK certification
        id: load
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/phase4-evidence"
          stats="$evidence/docker-stats.tsv"
          : > "$stats"

          (
            while docker inspect backend >/dev/null 2>&1; do
              line="$(docker stats --no-stream --format '{{.CPUPerc}}	{{.MemUsage}}' backend 2>/dev/null || true)"
              if [ -n "$line" ]; then
                printf '%s\t%s\n' "$(date +%s)" "$line" >> "$stats"
              fi
              sleep 5
            done
          ) &
          sampler_pid=$!

          set +e
          docker run --rm             --network "$RP894_NETWORK"             -v "$GITHUB_WORKSPACE:/workspace:ro"             -v "$RP894_SECRETS_DIR:/secrets:ro"             -v "$evidence:/evidence"             -w /workspace             -e PYTHONPATH=/app:/workspace             -e RESOURCEPLANNER_DATABASE_URL="$RP894_DATABASE_URL"             -e RESOURCEPLANNER_PHASE4_ISOLATED_LOAD=ISSUE_894_DISPOSABLE_SQLSERVER             resourceplanner-894-feature-backend             python tools/issue_894_phase4_load.py run               --credentials /secrets/sessions.json               --output /evidence/mixed-load.json               --head-sha "$RP894_HEAD_SHA"
          load_status=$?
          kill "$sampler_pid" >/dev/null 2>&1 || true
          wait "$sampler_pid" >/dev/null 2>&1 || true

          docker run --rm             -v "$GITHUB_WORKSPACE:/workspace:ro"             -v "$evidence:/evidence"             -w /workspace             -e PYTHONPATH=/app:/workspace             resourceplanner-894-feature-backend             python tools/issue_894_phase4_stats.py               --input /evidence/docker-stats.tsv               --output /evidence/docker-stats.json               --allocated-cpus "$(nproc)"
          stats_status=$?

          docker stats --no-stream --format '{{json .}}' backend frontend             > "$evidence/final-docker-stats.jsonl" || true
          log_path="$(docker inspect backend --format '{{.LogPath}}')"
          if [ -f "$log_path" ]; then
            stat -c '%s' "$log_path" > "$evidence/backend-access-log-bytes.txt"
          fi
          docker logs --tail=200 backend > "$evidence/backend-log-tail.txt" 2>&1 || true
          set -e

          test "$load_status" = "0"
          test "$stats_status" = "0"

      - name: Run existing V2 API performance budget
        id: benchmark
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          docker run --rm             -v "$GITHUB_WORKSPACE:/workspace:ro"             -v "$GITHUB_WORKSPACE/phase4-evidence:/evidence"             -w /workspace             -e PYTHONPATH=/app:/workspace             resourceplanner-894-feature-backend             python tools/benchmark_v2_api.py               --iterations 3               --ci               --output /evidence/v2-api-benchmark.json

      - name: Build and test schema-compatible rollback bundle
        id: rollback
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/phase4-evidence"
          rollback_dir="$evidence/rollback"
          mkdir -p "$rollback_dir"

          sh tools/build_issue_894_rollback_bundle.sh             --prev-sha "$RP894_BASE_SHA"             --feature-sha "$RP894_HEAD_SHA"             --output-dir "$rollback_dir"

          tag="$(cat "$rollback_dir/issue-894-rollback-tag.txt")"
          rollback_backend="resourceplanner-backend:$tag"
          rollback_frontend="resourceplanner-frontend:$tag"

          docker stop --time 30 frontend backend >/dev/null 2>&1 || true
          docker rm -f frontend backend >/dev/null 2>&1 || true

          docker run -d             --name backend             --network "$RP894_NETWORK"             -e RESOURCEPLANNER_DATABASE_URL="$RP894_DATABASE_URL"             -e RESOURCEPLANNER_HOST=0.0.0.0             -e RESOURCEPLANNER_PORT=8000             -e RESOURCEPLANNER_LOG_LEVEL=info             -e RESOURCEPLANNER_AUTH_MODE=oidc             -e RESOURCEPLANNER_OIDC_DISCOVERY_URL=https://identity.example.invalid/.well-known/openid-configuration             -e RESOURCEPLANNER_OIDC_CLIENT_ID=issue-894-rollback             -e RESOURCEPLANNER_OIDC_REDIRECT_URI=http://frontend:8080/api/v1/auth/callback             -e RESOURCEPLANNER_OIDC_SECURE_COOKIE=false             -e RESOURCEPLANNER_API_DOCS_ENABLED=false             -e RESOURCEPLANNER_ERP_SYNC_ENABLED=false             "$rollback_backend" >/dev/null

          for attempt in $(seq 1 60); do
            if docker run --rm --network "$RP894_NETWORK"               "$rollback_backend"               python -c "from urllib.request import urlopen; r=urlopen('http://backend:8000/ready', timeout=3); raise SystemExit(0 if r.status == 200 else 1)"               >/dev/null 2>&1; then
              break
            fi
            test "$attempt" != "60"
            sleep 2
          done

          docker run -d             --name frontend             --network "$RP894_NETWORK"             -e RESOURCEPLANNER_ENVIRONMENT=TEST             "$rollback_frontend" >/dev/null

          for attempt in $(seq 1 60); do
            if docker run --rm --network "$RP894_NETWORK"               "$rollback_backend"               python -c "from urllib.request import urlopen; r=urlopen('http://frontend:8080/ready', timeout=3); raise SystemExit(0 if r.status == 200 else 1)"               >/dev/null 2>&1; then
              break
            fi
            test "$attempt" != "60"
            sleep 2
          done

          docker run --rm             --network "$RP894_NETWORK"             -v "$GITHUB_WORKSPACE:/workspace:ro"             -v "$RP894_SECRETS_DIR:/secrets:ro"             -v "$evidence:/evidence"             -w /workspace             -e PYTHONPATH=/app:/workspace             resourceplanner-894-feature-backend             python tools/issue_894_phase4_load.py rollback-smoke               --credentials /secrets/sessions.json               --output /evidence/rollback-smoke.json

          docker inspect backend frontend             > "$evidence/rollback-runtime-inspect.json"

      - name: Upload Phase 4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-894-phase4-evidence-${{ github.event.pull_request.head.sha }}
          path: phase4-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Clean disposable Phase 4 runtime
        if: always()
        shell: bash
        run: |
          docker rm -f frontend backend >/dev/null 2>&1 || true
          if [ -n "${RP894_SQL_SERVER:-}" ]; then
            docker rm -f "$RP894_SQL_SERVER" >/dev/null 2>&1 || true
          fi
          if [ -n "${RP894_NETWORK:-}" ]; then
            docker network rm "$RP894_NETWORK" >/dev/null 2>&1 || true
          fi
          if [ -n "${RP894_SECRETS_DIR:-}" ]; then
            rm -rf "$RP894_SECRETS_DIR"
          fi

      - name: Enforce Phase 4 evidence gates
        if: always()
        shell: bash
        run: |
          test "${{ steps.load.outcome }}" = "success"
          test "${{ steps.benchmark.outcome }}" = "success"
          test "${{ steps.rollback.outcome }}" = "success"
