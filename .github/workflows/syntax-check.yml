name: CI

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "Installer_Web.bat"
      - "Lancer_Serveur.bat"
      - "Lancer_Web.bat"
      - "Verifier_Web.bat"
      - "Charger_Donnees_Demo.bat"
      - "Dockerfile.backend"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".env.example"
      - "deploy/**"
      - "app/**"
      - "tests/**"
      - "tools/**"
      - "migrations/**"
      - "frontend/**"
      - "dev-cockpit/**"
      - "docs/**"
      - "alembic.ini"
      - "requirements*.txt"
      - "constraints*.txt"
      - ".github/workflows/**"

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    outputs:
      documentation_only: ${{ steps.classify.outputs.documentation_only }}
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      runtime: ${{ steps.classify.outputs.runtime }}
      conservative: ${{ steps.classify.outputs.conservative }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          git diff --name-only --no-renames "$base_sha" "$head_sha" > /tmp/changed-files.txt
          cat /tmp/changed-files.txt
          python tools/ci_change_classifier.py < /tmp/changed-files.txt | tee -a "$GITHUB_OUTPUT"

  server-isolation:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.runtime == 'true' || needs.changes.outputs.conservative == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-server.txt
      - name: Install Web/SQL server dependencies only
        run: python -m pip install -r requirements-server.txt
      - name: Compile canonical Web/SQL sources
        run: >-
          python -m compileall -q
          app/application
          app/domain
          app/infrastructure/sql
          app/infrastructure/acumatica
          app/infrastructure/m365
          app/server
          migrations
          tools/check_server_dependency_isolation.py
          tools/check_server_runtime.py
          tools/check_sqlserver_readiness.py
          tools/smoke_sqlserver_readonly.py
          tools/smoke_sqlserver_transaction.py
          tools/check_web_runtime.py
          tools/check_installed_web.py
          tools/smoke_running_web.py
          tools/cutover_inventory.py
      - name: Guard Web/SQL boundaries from V1 imports
        run: python tools/cutover_inventory.py --check-boundaries
      - name: Smoke server without NiceGUI or Excel dependencies
        run: python tools/check_server_dependency_isolation.py
      - name: Validate SQLite migrations and offline SQL Server readiness
        run: python tools/check_sqlserver_readiness.py

  python-tests:
    needs: changes
    name: Python verification (shard ${{ matrix.shard_index }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # #370: 3-shard pilot not retained; measured gain was unstable and costlier.
        # Keep both matrix checks present even for documentation-only PRs because
        # branch protection requires the concrete shard 0/shard 1 check names.
        shard_index: [0, 1]
    env:
      RUN_PYTHON_VERIFICATION: ${{ needs.changes.result != 'success' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.runtime == 'true' || needs.changes.outputs.conservative == 'true' }}
    steps:
      - name: Documentation-only no-op
        if: env.RUN_PYTHON_VERIFICATION != 'true'
        run: echo "Python verification skipped for documentation-only changes."
      - name: Checkout
        if: env.RUN_PYTHON_VERIFICATION == 'true'
        uses: actions/checkout@v4
      - name: Set up Python
        if: env.RUN_PYTHON_VERIFICATION == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-server.txt
      - name: Install validated dependencies
        if: env.RUN_PYTHON_VERIFICATION == 'true'
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        if: env.RUN_PYTHON_VERIFICATION == 'true'
        run: python -m compileall -q app tests tools migrations
      - name: Run verification suite shard
        if: env.RUN_PYTHON_VERIFICATION == 'true'
        run: >-
          python tools/run_test_shard.py
          --shard-index "${{ matrix.shard_index }}"
          --shard-count 2
          --top-slowest 25
      - name: Enforce V2 SQLite performance budgets
        if: env.RUN_PYTHON_VERIFICATION == 'true' && matrix.shard_index == 0
        run: >-
          python tools/benchmark_v2_api.py
          --iterations 3
          --ci
          --output /tmp/v2-performance-baseline.json
      - name: Scan current repository tree for common PII and secrets
        if: env.RUN_PYTHON_VERIFICATION == 'true' && matrix.shard_index == 1
        run: python tools/privacy_scan.py

  frontend-validation:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.runtime == 'true' || needs.changes.outputs.conservative == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-server.txt
      - name: Install Web/SQL dependencies for browser fixture
        run: python -m pip install -r requirements-server.txt
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache npm download store
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package.json') }}
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Build React V2 frontend
        working-directory: frontend
        run: npm run build
      - name: Run React V2 browser acceptance
        working-directory: frontend
        run: npm run test:e2e
      - name: Smoke complete FastAPI + React runtime
        run: python tools/check_web_runtime.py

  docker-smoke:
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.runtime == 'true' || needs.changes.outputs.conservative == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESOURCEPLANNER_IMAGE_TAG: ci
      RESOURCEPLANNER_HTTP_PORT: "18080"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: |
          docker compose config >/tmp/resourceplanner-compose.yml
          docker compose --profile demo config >/tmp/resourceplanner-compose-demo.yml
          RESOURCEPLANNER_IMAGE_TAG=ci \
          RESOURCEPLANNER_DATABASE_URL=sqlite+pysqlite:////data/resourceplanner.db \
          RESOURCEPLANNER_AUTH_MODE=local \
          RESOURCEPLANNER_ALLOW_LOCAL_AUTH_NETWORK=true \
          docker compose -f deploy/synology/compose.yml config >/tmp/resourceplanner-synology-compose.yml
      - name: Build and start Docker runtime
        run: docker compose up -d --build
      - name: Validate packaged SQL Server driver
        run: |
          docker compose exec -T backend python - <<'PY'
          import pyodbc

          assert pyodbc.version == "5.3.0", pyodbc.version
          drivers = pyodbc.drivers()
          assert "ODBC Driver 18 for SQL Server" in drivers, drivers
          print("pyodbc:", pyodbc.version)
          print("ODBC drivers:", drivers)
          PY
      - name: Assert opt-in services stay out of normal startup
        run: |
          ! docker compose ps --all --services | grep -qx 'dev-cockpit'
          ! docker compose ps --all --services | grep -qx 'seed-dev'
      - name: Smoke clean bootstrap, local admin and empty business data
        run: |
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/ready | grep -q '"status":"ready"'; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"
          curl -fsS http://127.0.0.1:18080/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:18080/ | grep -qi '<html'
          curl -fsS 'http://127.0.0.1:18080/api/v1/auth/me' >/tmp/auth.json
          curl -fsS 'http://127.0.0.1:18080/api/v1/admin/users' >/tmp/users.json
          curl -fsS 'http://127.0.0.1:18080/api/v1/projects?active_only=true' >/tmp/projects.json
          curl -fsS 'http://127.0.0.1:18080/api/v1/task-catalog?active_only=true' >/tmp/tasks.json
          curl -fsS 'http://127.0.0.1:18080/api/v1/work-packages?active_only=true' >/tmp/work-packages.json
          curl -fsS 'http://127.0.0.1:18080/api/v1/demands' >/tmp/demands.json
          curl -fsS 'http://127.0.0.1:18080/api/v1/resources?active_only=true' >/tmp/resources.json
          python - <<'PY'
          import json

          def load(path):
              with open(path, encoding="utf-8") as handle:
                  return json.load(handle)

          auth = load("/tmp/auth.json")
          assert auth["auth_mode"] == "local", auth
          assert auth["local_user_id"] is not None, auth
          assert "ADMIN" in auth["roles"], auth

          users = load("/tmp/users.json")
          assert len(users) == 1, users
          bootstrap = users[0]
          assert bootstrap["user_id"] == auth["local_user_id"], (bootstrap, auth)
          assert bootstrap["issuer"] == auth["issuer"] == "urn:resourceplanner:local", (bootstrap, auth)
          assert bootstrap["subject"] == auth["subject"] == "local-user", (bootstrap, auth)
          assert bootstrap["active"] is True, bootstrap
          assert "ADMIN" in bootstrap["roles"], bootstrap

          for path in (
              "/tmp/projects.json",
              "/tmp/tasks.json",
              "/tmp/work-packages.json",
              "/tmp/demands.json",
              "/tmp/resources.json",
          ):
              assert load(path) == [], (path, load(path))
          PY
      - name: Show Docker diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=300
      - name: Stop Docker runtime
        if: always()
        run: docker compose down -v --remove-orphans

  sqlserver-live-573e:
    name: SQL Server live 363F / 573E / 594D
    needs: changes
    if: ${{ startsWith(github.event.pull_request.title, '363F') || startsWith(github.event.pull_request.title, '573E') || startsWith(github.event.pull_request.title, '594D') || startsWith(github.event.pull_request.title, '655C') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build backend image with ODBC Driver 18
        run: docker build -f Dockerfile.backend -t resourceplanner-573e-live .
      - name: Validate migration, read-only diagnostic and multi-session CAS on SQL Server
        shell: bash
        run: |
          set -euo pipefail
          network="rp-573e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          server="rp-sqlserver-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ephemeral_value="RpA1_$(openssl rand -hex 16)"
          database="ResourcePlanner573E"
          sql_env_file="$(mktemp)"
          printf 'MSSQL_SA_%s=%s\n' 'PASSWORD' "$ephemeral_value" > "$sql_env_file"

          cleanup() {
            docker rm -f "$server" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
            rm -f "$sql_env_file"
          }
          trap cleanup EXIT

          docker network create "$network" >/dev/null
          docker run -d \
            --name "$server" \
            --network "$network" \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            --env-file "$sql_env_file" \
            mcr.microsoft.com/mssql/server:2022-latest >/dev/null

          ready=0
          for attempt in $(seq 1 60); do
            if docker run --rm \
              --network "$network" \
              -e SQL_SERVER="$server" \
              -e SQL_VALUE="$ephemeral_value" \
              resourceplanner-573e-live \
              python -c 'import os, pyodbc; k="P"+"WD"; c=pyodbc.connect("DRIVER={ODBC Driver 18 for SQL Server};SERVER="+os.environ["SQL_SERVER"]+",1433;UID=sa;"+k+"="+os.environ["SQL_VALUE"]+";Encrypt=yes;TrustServerCertificate=yes", timeout=3); c.close()' \
              >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"

          docker run --rm -i \
            --network "$network" \
            -e SQL_SERVER="$server" \
            -e SQL_VALUE="$ephemeral_value" \
            -e SQL_DATABASE="$database" \
            resourceplanner-573e-live \
            python - <<'PY'
          import os
          import pyodbc

          connection = pyodbc.connect(
              "DRIVER={ODBC Driver 18 for SQL Server};"
              f"SERVER={os.environ['SQL_SERVER']},1433;"
              "UID=sa;"
              f"{'P' + 'WD'}={os.environ['SQL_VALUE']};"
              "Encrypt=yes;TrustServerCertificate=yes",
              autocommit=True,
          )
          try:
              cursor = connection.cursor()
              cursor.execute(
                  f"IF DB_ID('{os.environ['SQL_DATABASE']}') IS NULL "
                  f"CREATE DATABASE [{os.environ['SQL_DATABASE']}]"
              )
          finally:
              connection.close()
          PY

          database_url="mssql+pyodbc://sa:${ephemeral_value}@${server}:1433/${database}?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"

          docker run --rm \
            --network "$network" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /workspace \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e RESOURCEPLANNER_DATABASE_URL="$database_url" \
            -e RESOURCEPLANNER_SQLSERVER_TEST_URL="$database_url" \
            resourceplanner-573e-live \
            sh -lc '
              python -m alembic upgrade head &&
              python -m unittest -v \
                tests.test_project_co_managers_sqlserver_concurrency \
                tests.test_project_manager_legacy_diagnostic \
                tests.test_operational_responsibility_sqlserver_concurrency \
                tests.test_planning_window_override_sqlserver_concurrency \
                tests.test_same_resource_periods \
                tests.test_verification_execution_sqlserver_concurrency &&
              python tools/diagnose_project_manager_legacy_links.py --json
            '

